<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BOS 身体风控工作台</title>
<style>
:root{
  --paper:#F1EEE6;          /* 暖灰纸张 */
  --paper2:#F9F7F1;         /* 卡片纸面 */
  --paper3:#EAE5D8;         /* 凹陷区 */
  --ink:#2A2E28;            /* 正文墨色 */
  --muted:#7C776B;          /* 次级文字 */
  --line:#D9D1BF;           /* 发丝线 */
  --primary:#2E4A3B;        /* 深森林绿（主色） */
  --primary-deep:#22382D;
  --accent:#C2623B;         /* 陶土橙（按钮/CTA） */
  --accent-deep:#A74E2B;
  --good:#32887C;
  --bad:#B36146;
  --warn:#BF9237;
  --font-display:Georgia,"Times New Roman","Songti SC","Noto Serif CJK SC","SimSun",serif;
  --font-body:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
  --font-mono:ui-monospace,"SF Mono","Menlo","Consolas","Liberation Mono",monospace;
  --r:10px; --r-sm:6px; --r-pill:999px;
  /* legacy token aliases（diet 模块内联样式仍引用旧变量名，统一映射到 Editorial token） */
  --color-background-primary:var(--paper2);
  --color-background-secondary:var(--paper3);
  --color-background-tertiary:var(--paper3);
  --color-border-primary:var(--line);
  --color-border-secondary:var(--line);
  --color-border-tertiary:var(--line);
  --color-text-primary:var(--ink);
  --color-text-secondary:var(--muted);
  --g:var(--good); --gl:rgba(50,136,124,.14); --or:var(--accent); --re:var(--bad); --bl:#3B82F6; --unmet:var(--warn);
  /* 营养报告莫兰迪色板 → 2026-09-05 公主参考图采样定版（青绿/橄榄/砖红/芥末金/深棕） */
  --mc-c:#BF9237;--mc-p:#32887C;--mc-f:#96A75E;--mc-fib:#6E6450;--rc-ok:#32887C;--rc-over:#B36146;--rc-under:#BF9237;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-body);background:var(--paper);
  background-image:
    radial-gradient(1200px 600px at 85% -10%, rgba(194,98,59,0.05), transparent 60%),
    radial-gradient(1000px 500px at -10% 30%, rgba(46,74,59,0.05), transparent 55%);
  color:var(--ink);min-height:100vh;line-height:1.6;-webkit-font-smoothing:antialiased}
.app{width:100%;margin:0;padding:28px 20px 64px;box-sizing:border-box}
/* ── 桌面全宽侧栏布局：左导航 + 右内容 ── */
.shell{display:flex;align-items:stretch;min-height:calc(100vh - 92px)}
.sidenav{flex:0 0 236px;background:var(--paper2);border:1px solid var(--line);border-radius:16px;padding:18px 10px 14px;margin-right:18px;position:sticky;top:20px;height:calc(100vh - 40px);box-sizing:border-box;display:flex;flex-direction:column;overflow-y:auto}
.slogo{display:flex;flex-direction:column;gap:2px;padding:2px 8px 14px;border-bottom:1px dashed var(--line);margin:0 2px 12px}
.slogo b{font-family:var(--font-display);font-size:27px;font-weight:800;color:var(--primary);letter-spacing:1.5px;line-height:1}
.slogo span{font-size:12px;color:var(--ink);letter-spacing:.34em;font-weight:600}
.snav{display:flex;flex-direction:column;gap:3px}
.snav-btn{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:10px;border:none;background:none;cursor:pointer;font-size:13px;font-weight:500;color:var(--muted);font-family:inherit;transition:all .16s;text-align:left;width:100%}
.snav-btn .ic{flex-shrink:0;display:inline-flex}
.snav-btn:hover{background:var(--paper3);color:var(--primary)}
.snav-btn.active{background:var(--primary);color:var(--paper2);font-weight:600}
.snav-foot{margin-top:auto;padding:12px 8px 2px;font-size:10px;color:var(--muted);opacity:.75;line-height:1.6;border-top:1px dashed var(--line)}
.snav-warn-hd{font-size:10.5px;font-weight:700;color:var(--accent-deep);opacity:1;margin-bottom:2px}
.snav-warn-list{margin-top:3px;line-height:1.9}
.snav-kbtn{margin-top:7px;width:100%;border:1px solid rgba(194,98,59,.4);background:rgba(194,98,59,.08);color:var(--accent-deep);border-radius:7px;padding:5px 6px;font-size:10.5px;font-weight:600;line-height:1.5;cursor:pointer;font-family:inherit;opacity:1;transition:background .15s}
.snav-kbtn:hover{background:rgba(194,98,59,.18)}
.smain{flex:1;min-width:0}
/* 首页左边栏 · 今日待办 */
.snav-todo{margin-top:16px;padding-top:14px;border-top:1px dashed var(--line)}
.snav-todo-hd{font-size:13.5px;font-weight:700;color:var(--ink);font-family:var(--font-display)}
.snav-todo-sub{display:block;font-size:10px;color:var(--muted);font-weight:400;margin-top:2px}
.snav-todo-add{display:flex;gap:6px;margin:10px 0 8px}
.snav-todo-add input{flex:1;min-width:0;padding:6px 8px;border:1px solid var(--line);border-radius:8px;font-size:12px;background:var(--paper);color:var(--ink);outline:none;font-family:var(--font-body);transition:border-color .15s}
.snav-todo-add input:focus{border-color:var(--accent)}
.snav-todo-add button{flex:none;width:28px;height:28px;border:1px solid var(--accent);border-radius:8px;background:transparent;color:var(--accent);font-size:16px;cursor:pointer;line-height:1}
.snav-todo-add button:hover{background:rgba(194,98,59,.1)}
.snav-todo-it{display:flex;align-items:center;gap:6px;padding:5px 6px;border-radius:8px;margin-bottom:4px;font-size:12px}
.snav-todo-it.top{background:rgba(194,98,59,.09);border-left:2px solid var(--accent)}
.snav-todo-it.top .snav-todo-txt{color:var(--accent-deep,var(--accent));font-weight:600}
.snav-todo-it.done .snav-todo-txt{text-decoration:line-through;color:var(--muted);font-weight:400}
.snav-todo-it.done.top{background:rgba(194,98,59,.05)}
.snav-todo-chk{flex:none;width:16px;height:16px;border:1.5px solid var(--line);border-radius:5px;background:var(--paper);cursor:pointer;font-size:10px;line-height:1;color:var(--accent);padding:0}
.snav-todo-it.done .snav-todo-chk{background:var(--accent);border-color:var(--accent);color:#fff}
.snav-todo-txt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.snav-todo-rm{flex:none;border:none;background:none;color:var(--muted);cursor:pointer;font-size:13px;padding:0 2px;opacity:.55}
.snav-todo-rm:hover{opacity:1;color:#B03A2E}
.snav-todo-empty{font-size:11px;color:var(--muted);padding:2px 0 4px;line-height:1.5}
.snav-todo-foot{font-size:10.5px;color:var(--muted);margin-top:4px}
@media(max-width:860px){
  .shell{flex-direction:column;min-height:0}
  .sidenav{flex:none;width:100%;position:static;height:auto;border-radius:14px;padding:12px 10px;margin:0 0 14px}
  .slogo{flex-direction:row;align-items:baseline;gap:8px;padding:0 6px 8px;margin:0 0 8px}
  .snav{flex-direction:row;gap:4px;overflow-x:auto;padding-bottom:2px}
  .snav-btn{padding:7px 12px;flex-shrink:0;width:auto}
  .snav-foot{display:none}
}
@media(min-width:861px){
  .snav-btn .snav-lb{display:block}
}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:1.1rem;padding-bottom:14px;border-bottom:3px double var(--line)}
.logo{font-family:var(--font-display);font-size:19px;font-weight:700;color:var(--primary);letter-spacing:-0.3px}
.tabs{display:flex;gap:4px;background:var(--paper3);border-radius:var(--r-pill);padding:3px;border:1px solid var(--line)}
.tab{padding:6px 14px;border-radius:var(--r-pill);border:none;background:none;cursor:pointer;font-size:12px;font-weight:500;color:var(--muted);transition:all .2s;font-family:inherit}
.tab.active{background:var(--primary);color:var(--paper2);font-weight:600}
.tab:hover:not(.active){background:var(--paper2)}
.date-nav{display:flex;align-items:center;gap:6px;margin-bottom:.75rem}
.date-nav button{background:var(--paper2);border:1px solid var(--line);border-radius:8px;width:30px;height:30px;cursor:pointer;color:var(--muted);font-size:16px;display:flex;align-items:center;justify-content:center;transition:all .2s}
.date-nav button:hover{background:var(--paper3);border-color:var(--primary);color:var(--primary)}
.dlabel{font-size:13px;color:var(--muted);flex:1;text-align:center;font-weight:500}
/* ⚠️ 必须用 .date-nav button.today-btn 双类加权：.date-nav button 通配（width:30px+灰底）特异性更高，
   曾连续四轮压制 .today-btn 的全部样式（公主 2026-09-04 连环抓出） */
.date-nav button.today-btn,.report-nav button.today-btn{width:auto;flex:none;font-size:11px;white-space:nowrap;font-weight:600;color:#fff;background:var(--accent);border:1px solid var(--accent);border-radius:13px;padding:3px 14px;box-shadow:0 1px 4px rgba(194,98,59,.25)}
.date-nav button.today-btn:hover,.report-nav button.today-btn:hover{background:var(--accent-deep);border-color:var(--accent-deep);color:#fff}
.card,.summary-card,.meal-section,.sc,.stat-card,.chart-card,.ov-card,.bos-badge,.macro-card{
  background:var(--paper2);border:1px solid var(--line);border-radius:14px;padding:1rem 1.1rem;margin-bottom:.75rem;
  box-shadow:0 8px 24px rgba(42,46,40,.05);transition:border-color .3s}
.summary-card:hover,.meal-section:hover,.sc:hover,.stat-card:hover,.chart-card:hover{border-color:rgba(46,74,59,.25)}
.summary-top{display:flex;align-items:center;gap:1.25rem;margin-bottom:.85rem}
.ring-wrap{position:relative;flex-shrink:0;width:110px;height:110px}
.ring-wrap svg{position:absolute;inset:0}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-num{font-size:22px;font-weight:700;line-height:1;color:var(--primary)}
.ring-sub{font-size:10px;color:var(--muted);margin-top:1px}
.ring-remain{font-size:10px;margin-top:3px;font-weight:500;color:var(--accent-deep)}
.macros{flex:1;display:flex;flex-direction:column;gap:7px}
.mc{display:flex;align-items:center;gap:8px}
.mc-name{font-size:11px;color:var(--muted);width:38px;flex-shrink:0}
.mc-bar{flex:1;height:5px;border-radius:3px;background:var(--paper3);overflow:hidden}
.mc-fill{height:100%;border-radius:3px}
.mc-val{font-size:11px;font-weight:500;min-width:52px;text-align:right;color:var(--ink)}
.fiber-row{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);padding:6px 0 0;border-top:1px solid var(--line);margin-top:4px}
.fiber-val{font-weight:500;color:var(--accent)}
.micro-row{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);padding:4px 0 0;gap:12px}
.micro-row .mr{display:flex;gap:4px}
.micro-row .mr-val{font-weight:500;color:var(--ink)}
.pct-section{border-top:1px solid var(--line);padding-top:.85rem}
.pct-title{font-size:10px;color:var(--muted);margin-bottom:6px}
.stacked{display:flex;height:18px;border-radius:9px;overflow:hidden;background:var(--paper3)}
.seg{height:100%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:600;color:var(--paper2);overflow:hidden}
.pct-legend{display:flex;gap:14px;margin-top:8px;flex-wrap:wrap}
.pl{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--ink)}
.pl-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.ideal{font-size:10px;color:var(--muted);margin-top:6px;padding:5px 8px;background:var(--paper3);border-radius:6px}
.meal-header{display:flex;justify-content:space-between;align-items:center;padding:10px 14px}
.meal-title{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:500;font-family:var(--font-display)}
.meal-icon{width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;background:var(--paper3)}
.meal-kcal{font-size:11px;color:var(--muted)}
.add-btn,.paste-btn{background:transparent;border:1px solid var(--accent);border-radius:8px;padding:4px 12px;font-size:11px;cursor:pointer;color:var(--accent);transition:all .2s;font-family:inherit}
.add-btn:hover,.paste-btn:hover{background:var(--accent);color:var(--paper2)}
.food-list{border-top:1px solid var(--line)}
.fi{display:flex;align-items:center;padding:7px 14px;gap:8px;border-bottom:1px solid var(--line);transition:background .2s}
.fi:last-child{border-bottom:none}
.fi:hover{background:var(--paper3)}
.fi-info{flex:1;min-width:0}
.fi-name{font-size:12px;font-weight:500;color:var(--ink)}
.fi-detail{font-size:10px;color:var(--muted);margin-top:1px}
.fi-kcal{font-size:12px;font-weight:600;color:var(--accent);white-space:nowrap}
.del{background:none;border:none;cursor:pointer;color:var(--muted);opacity:0;font-size:15px;padding:2px 5px;border-radius:4px;transition:all .2s}
.fi:hover .del{opacity:1}
.del:hover{color:var(--bad)}
.copy-btn{background:none;border:none;cursor:pointer;opacity:0;font-size:14px;padding:2px 5px;border-radius:4px;flex-shrink:0;transition:all .2s}
.fi:hover .copy-btn{opacity:.6;cursor:pointer}
.copy-btn:hover{opacity:1!important}
.copy-btn.copied{opacity:1;color:var(--primary);cursor:default}
.paste-area{padding:8px 12px;border-bottom:1px solid var(--line);flex-shrink:0}
.paste-btn{width:100%;padding:9px;background:transparent;border:1px dashed var(--accent);border-radius:10px;font-size:12px;cursor:pointer;color:var(--accent);font-weight:500;text-align:center;display:flex;align-items:center;justify-content:center;gap:6px;transition:all .2s}
.paste-btn:hover{background:var(--accent);color:var(--paper2);border-style:solid}
.paste-clear{background:none;border:none;cursor:pointer;font-size:10px;color:var(--muted);padding:2px}
.batch-area{padding:12px;display:flex;flex-direction:column;gap:10px;flex:1;overflow-y:auto;background:var(--paper)}
.batch-area textarea{flex:1;min-height:130px;padding:10px;border:1px solid var(--line);border-radius:10px;font-size:14px;resize:none;outline:none;background:var(--paper2);color:var(--ink);font-family:var(--font-body);line-height:1.6;transition:border-color .2s}
.batch-area textarea:focus{border-color:var(--accent)}
.batch-btns{display:flex;gap:8px}
.batch-result{font-size:12px;color:var(--muted);line-height:1.6;min-height:20px}
.modal-bg{position:fixed;inset:0;background:rgba(42,46,40,.45);display:flex;align-items:flex-end;justify-content:center;z-index:200;backdrop-filter:blur(4px)}
@media(min-width:500px){.modal-bg{align-items:center}}
.modal{background:var(--paper2);border:1px solid var(--line);border-radius:18px 18px 0 0;width:100%;max-width:440px;max-height:92vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(42,46,40,.25)}
@media(min-width:500px){.modal{border-radius:16px;max-height:82vh}}
.mh{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);flex-shrink:0}
.mh h3{font-size:14px;font-weight:500;color:var(--ink);font-family:var(--font-display)}
.mclose{background:none;border:none;cursor:pointer;font-size:20px;color:var(--muted);width:30px;height:30px;border-radius:7px;display:flex;align-items:center;justify-content:center;transition:all .2s}
.mclose:hover{background:var(--paper3)}
.mtabs{display:flex;border-bottom:1px solid var(--line);flex-shrink:0}
.mtab{flex:1;padding:9px 4px;background:none;border:none;cursor:pointer;font-size:12px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .2s;font-family:inherit}
.mtab.active{color:var(--primary);border-bottom-color:var(--primary);font-weight:500}
.search-wrap{padding:8px 12px;border-bottom:1px solid var(--line);flex-shrink:0}
.search-wrap input{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:9px;font-size:14px;background:var(--paper2);color:var(--ink);outline:none;font-family:var(--font-body);transition:border-color .2s}
.search-wrap input:focus{border-color:var(--accent)}
.cat-chips{display:flex;gap:5px;overflow-x:auto;padding:6px 12px;border-bottom:1px solid var(--line);flex-shrink:0;scrollbar-width:none}
.cat-chips::-webkit-scrollbar{display:none}
.chip{padding:4px 10px;border-radius:var(--r-pill);border:1px solid var(--line);background:none;cursor:pointer;font-size:11px;color:var(--muted);white-space:nowrap;flex-shrink:0;transition:all .2s;font-family:inherit}
.chip.active{background:var(--primary);color:var(--paper2);border-color:var(--primary)}
.chip:hover:not(.active){border-color:var(--primary)}
.scroll-list{overflow-y:auto;flex:1}
.food-row{display:flex;align-items:center;padding:9px 12px;border-bottom:1px solid var(--line);cursor:pointer;gap:8px;transition:background .2s}
.food-row:hover{background:var(--paper3)}
.food-row-info{flex:1;min-width:0}
.food-row-name{font-size:13px;font-weight:500;display:flex;align-items:center;gap:5px;color:var(--ink)}
.food-row-meta{font-size:10px;color:var(--muted);margin-top:2px}
.food-row-kcal{font-size:12px;font-weight:600;color:var(--accent)}
.badge{font-size:9px;padding:1px 5px;border-radius:4px;font-weight:500}
.badge-recent{background:rgba(46,74,59,.12);color:var(--primary)}
.empty-state{padding:28px;text-align:center;color:var(--muted);font-size:12px;line-height:1.8}
.weight-picker{padding:16px;display:flex;flex-direction:column;gap:12px;overflow-y:auto;flex:1}
.wp-food-name{font-size:17px;font-weight:600;text-align:center;font-family:var(--font-display)}
.wp-food-unit{font-size:11px;color:var(--muted);text-align:center;margin-top:3px}
.wp-gram-row{display:flex;align-items:center;gap:10px;background:var(--paper3);border-radius:10px;padding:10px 14px}
.wp-gram-label{font-size:12px;color:var(--muted);white-space:nowrap}
.wp-gram-input{flex:1;padding:6px;border:1px solid var(--line);border-radius:7px;font-size:22px;font-weight:600;background:var(--paper2);color:var(--ink);outline:none;text-align:center;max-width:110px;font-family:var(--font-body);transition:border-color .2s}
.wp-gram-input:focus{border-color:var(--accent)}
.wp-gram-unit{font-size:13px;color:var(--muted)}
.wp-quick-btns{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.wp-qb{padding:5px 12px;border-radius:var(--r-pill);border:1px solid var(--line);background:none;cursor:pointer;font-size:12px;color:var(--muted);transition:all .2s;font-family:inherit}
.wp-qb:hover,.wp-qb.active{border-color:var(--accent);color:var(--accent);background:rgba(194,98,59,.1);font-weight:500}
.wp-nutrition{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.wp-nc{background:var(--paper3);border-radius:9px;padding:8px;text-align:center}
.wp-nc-label{font-size:10px;color:var(--muted);margin-bottom:3px}
.wp-nc-val{font-size:15px;font-weight:600;color:var(--ink)}
.wp-add-btn{width:100%;padding:13px;background:var(--accent);color:var(--paper2);border:none;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;transition:all .2s;font-family:inherit}
.wp-add-btn:hover{background:var(--accent-deep)}
.wp-back{background:none;border:none;cursor:pointer;color:var(--muted);font-size:12px;padding:0;font-family:inherit}
.mm-item{border:1px solid var(--line);border-radius:10px;margin:6px;overflow:hidden;background:var(--paper2)}
.mm-header{display:flex;align-items:center;padding:10px 12px;gap:8px}
.mm-name{flex:1;font-size:13px;font-weight:500;color:var(--ink)}
.mm-sub{font-size:10px;color:var(--muted)}
.mm-use-btn{background:var(--accent);color:var(--paper2);border:none;border-radius:6px;padding:5px 12px;font-size:11px;cursor:pointer;font-weight:500;font-family:inherit}
.mm-del-btn{background:none;border:none;cursor:pointer;color:var(--muted);font-size:16px;padding:2px 6px;border-radius:5px;font-family:inherit}
.mm-del-btn:hover{color:var(--bad)}
.mm-foods{padding:0 12px 8px;font-size:10px;color:var(--muted)}
.save-meal-area{padding:8px 12px;border-top:1px solid var(--line);flex-shrink:0}
.save-meal-btn{width:100%;padding:9px;background:none;border:1px dashed var(--line);border-radius:8px;font-size:12px;cursor:pointer;color:var(--muted);transition:all .2s;font-family:inherit}
.save-meal-btn:hover{border-color:var(--accent);color:var(--accent)}
.save-meal-form{display:flex;gap:7px;margin-top:8px}

.bos-badge{border-radius:16px;padding:14px;margin-bottom:.75rem;text-align:center;background:var(--paper2);border:1px solid var(--line)}

.bos-num{font-size:34px;font-weight:700;color:var(--primary);line-height:1}

.bos-sub{font-size:11px;color:var(--muted);margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 8px}

.chip-lbl:hover{background:var(--paper2);border-color:var(--accent);color:var(--ink)}
.chip-lbl:has(input:checked){background:rgba(194,98,59,.1);border-color:var(--accent);color:var(--accent)}

.big-btn{width:100%;padding:11px;background:var(--accent);border:none;border-radius:12px;color:var(--paper2);font-size:13px;font-weight:700;cursor:pointer;margin-top:4px;font-family:inherit}

.tpl-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}

.vol-big{font-size:30px;font-weight:700;color:var(--primary);font-family:var(--font-display);letter-spacing:.5px;line-height:1.2;margin-bottom:4px}

.tpl-btn{padding:8px 14px;background:transparent;border:1px solid var(--accent);border-radius:10px;font-size:12px;cursor:pointer;color:var(--accent);transition:all .2s;font-family:inherit}

.ov-hero{margin-bottom:.75rem}
.ov-date{font-size:11px;color:var(--muted);letter-spacing:1px;font-family:var(--font-mono)}

.ov-l{font-size:11px;color:var(--muted);margin-top:6px}

.ic{display:inline-block;vertical-align:-2px;flex:none}
.tab .ic,.mtab .ic,.chip .ic,.rnav .ic,.big-btn .ic,.add-btn .ic,.paste-btn .ic,.smf-save .ic,.mm-use-btn .ic{margin-right:4px;vertical-align:-1.5px}

.bos-mast{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;padding-bottom:16px;margin-bottom:20px;border-bottom:3px double var(--line)}
.bos-greet{font-family:var(--font-display);font-size:clamp(26px,4.6vw,40px);font-weight:700;line-height:1.12;letter-spacing:-0.01em;color:var(--primary);text-wrap:balance}
.bos-greet .bos-name{color:var(--accent)}
.bos-date{margin-top:9px;font-family:var(--font-mono);font-size:12px;color:var(--muted);letter-spacing:.05em;line-height:1.7}

.bos-meta{margin-left:auto;font-family:var(--font-mono);font-size:10.5px;color:var(--muted);white-space:nowrap}
.bos-note{font-size:11px;color:var(--muted);line-height:1.6;margin:0 0 4px}
.bos-note b{color:var(--accent-deep);font-weight:600}
.bos-chart{position:relative;width:100%}
.bos-tt{position:absolute;top:4px;transform:translateX(-50%);background:var(--ink);color:var(--paper2);font-size:11px;line-height:1.4;padding:6px 10px;border-radius:6px;pointer-events:none;opacity:0;transition:opacity .1s;z-index:2;min-width:150px;font-family:var(--font-mono)}
.bos-tt.show{opacity:.96}
.bos-tt b{font-family:var(--font-body);font-weight:600;display:block;margin-bottom:3px;letter-spacing:.03em}
.bos-tt .ttr{display:flex;align-items:center;gap:7px;padding:1.5px 0;white-space:nowrap}
.bos-tt .ttr i{width:8px;height:8px;border-radius:2px;display:inline-block;flex:none}
.bos-tt .ttr .tt-n{opacity:.55}
.bos-empty{display:flex;align-items:center;justify-content:center;position:absolute;inset:0;font-size:12px;color:var(--muted);text-align:center;padding:0 30px;z-index:1}
.bos-jump{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.bos-jc{display:flex;flex-direction:column;align-items:center;gap:3px;background:var(--paper2);border:1px solid var(--line);border-radius:var(--r);padding:12px 4px 11px;cursor:pointer;color:var(--ink);font-family:inherit;transition:border-color .15s,transform .12s;text-align:center}
.bos-jc:hover{border-color:var(--accent);transform:translateY(-2px)}
.bos-jc-ic{color:var(--primary);line-height:1}
.bos-jc-l{font-size:10.5px;color:var(--muted)}
.bos-jc-v{font-size:13px;font-weight:700;color:var(--primary);min-height:18px;line-height:1.3}
.bos-jc-v .dot{width:9px;height:9px;margin:2px 0 0}
.bos-card-hd{display:flex;align-items:baseline;gap:10px;margin-bottom:12px}
.bos-card-hd .sec-title{margin-bottom:0}
.bos-sub{margin-left:auto;font-family:var(--font-mono);font-size:11px;color:var(--muted);white-space:nowrap}
/* ── 概览页奶油配色试点（2026-09-05 参考图色板：奶油橘/薄荷绿/纯白 + 衬线数字，仅 ov-cream 作用域） ── */
.ov-cream .card{border-radius:18px;box-shadow:0 10px 26px rgba(42,46,40,.04)}
.ov-cream .ov-peach{background:#FCF6EE;border-color:#F6ECDF}
.ov-cream .ov-mint{background:#DCE9DE;border-color:#CBDECF}
.ov-cream .ov-white{background:#FDFCF8;border-color:#E7E1D3}
.ov-cream .ov-peach .bos-seg button{background:rgba(255,255,255,.65)}
.ov-cream .ov-peach .bos-seg button.on{background:var(--primary);color:#fff}
.ov-cream .bos-sug{background:#FDFCF8;border-radius:14px}
.ov-cream .bos-jc{border-radius:14px}
.ov-cream .bos-jc-v{font-family:var(--font-display);letter-spacing:.02em}
.ov-cream .ring-num,.ov-cream .vol-big,.ov-cream .bos-num{font-family:var(--font-display)}
/* ── 全局奶油风升级（2026-09-05 概览试点推广全版面：卡面近白/发丝线变柔/圆角加大/数字衬线） ── */
:root{--paper2:#FDFCF8;--paper3:#F0EDE3;--line:#E4DDCC;--r:12px}
.card,.summary-card,.meal-section,.sc,.stat-card,.chart-card,.ov-card,.bos-badge,.macro-card{border-radius:18px;padding:1.1rem 1.25rem;box-shadow:0 10px 26px rgba(42,46,40,.04)}
.sidenav{border-radius:18px}
.sec-title{font-size:12px;letter-spacing:1.4px}
.stat-val,.macro-val,.ring-num,.bos-num,.vol-big{font-family:var(--font-display);letter-spacing:.02em}
.bos-plan-list{border-top:1px solid var(--line)}
.bos-plan-row{display:flex;align-items:center;gap:12px;padding:10px 2px;border-bottom:1px solid var(--line);cursor:pointer;user-select:none;transition:background .15s}
.bos-plan-row:hover{background:var(--paper3)}
.bos-plan-row .dow{width:56px;flex:none;font-family:var(--font-mono);font-size:11px;color:var(--muted);letter-spacing:.03em;line-height:1}
.bos-plan-row .day-tag{font-size:10px;color:var(--accent-deep);background:rgba(194,98,59,.12);border-radius:3px;padding:1px 5px;margin-left:5px;white-space:nowrap}
.bos-plan-row .pt{flex:1;font-size:13.5px;color:var(--ink);min-width:0}
.bos-plan-row.today .dow{color:var(--accent);font-weight:700}
.bos-plan-row.today .pt{font-weight:600;color:var(--primary)}
.bos-plan-row.done .pt{color:var(--muted);text-decoration:line-through}
.bos-plan-row .stamp,.bos-habit-row .stamp{width:20px;height:20px;flex:none;border:1.5px solid var(--line);border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:var(--paper2);transition:background .15s,border-color .15s}
.bos-plan-row.done .stamp,.bos-habit-row.done .stamp{background:var(--primary);border-color:var(--primary)}
.bos-plan-row .stamp svg,.bos-habit-row .stamp svg{width:12px;height:12px;stroke:#F3F0E6;stroke-width:3.2;fill:none;stroke-linecap:round;stroke-linejoin:round;display:none}
.bos-plan-row.done .stamp svg,.bos-habit-row.done .stamp svg{display:block}
.bos-habit-list{border-top:1px dashed var(--line)}
.bos-habit-row{display:flex;align-items:center;gap:12px;padding:8px 2px;border-bottom:1px dashed var(--line);cursor:pointer;user-select:none;transition:background .15s}
.bos-habit-row:hover{background:var(--paper3)}
.bos-habit-row .ht{flex:1;font-size:13.5px}
.bos-habit-row.done .ht{color:var(--muted);text-decoration:line-through}
.bos-streak{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap;align-items:center}
.hb-dot{width:11px;height:11px;border-radius:50%;background:var(--paper3);border:1px solid var(--line);flex:none}
.hb-dot.on{background:var(--good);border-color:var(--good)}
.bos-streak .cap{font-family:var(--font-mono);font-size:11px;color:var(--muted);margin-left:3px}
.bos-hint{font-size:11px;color:var(--muted);margin-top:10px;line-height:1.6}
.prog-label{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:6px;margin-top:12px;font-family:var(--font-mono)}
.prog-track{height:10px;background:var(--paper3);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.prog-fill{height:100%;background:var(--accent);border-radius:20px;transition:width .4s ease;min-width:0}
.bos-metric-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.bos-metric{background:var(--paper3);border-radius:var(--r);padding:11px 8px 10px;text-align:center}
.bos-metric .k{font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;color:var(--muted)}
.bos-metric .v{font-family:var(--font-display);font-size:22px;font-weight:700;color:var(--primary);line-height:1.25;font-variant-numeric:tabular-nums;min-height:28px}
.bos-metric .v small{font-size:11px;font-weight:500;color:var(--muted)}
.bos-goal-note{font-family:var(--font-mono);font-size:10.5px;color:var(--muted);margin-top:6px;line-height:1.6}
.bos-bmi-line{margin-top:12px;font-size:12.5px;color:var(--muted);line-height:1.6}
.bos-bmi-line b{color:var(--primary)}
.bos-bmi-bar{display:flex;height:9px;border-radius:20px;overflow:hidden;margin-top:8px;border:1px solid var(--line)}
.bos-bmi-bar span{flex:1}
.bos-bmi-bar .t1{background:#B9C4BA}.bos-bmi-bar .t2{background:#8FA98F}.bos-bmi-bar .t3{background:#D9A86C}.bos-bmi-bar .t4{background:#D97B5E}
.bos-bmi-marker{position:relative;height:13px}
.bos-bmi-marker i{position:absolute;top:1px;width:2px;height:11px;background:var(--accent)}
/* ══ 齿轮设置弹窗（调色沿用 --primary / --accent 体系） ══ */
.gear-mask{position:fixed;inset:0;background:rgba(42,46,40,.42);z-index:60;display:flex;align-items:center;justify-content:center;padding:18px}
.gear-box{background:var(--paper2);border:1px solid var(--line);border-radius:16px;width:100%;max-width:520px;max-height:88vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(42,46,40,.28);animation:gearIn .16s ease}
@keyframes gearIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.gear-hd{display:flex;align-items:center;justify-content:space-between;padding:13px 18px;border-bottom:1px solid var(--line);flex:none}
.gear-hd h3{font-family:var(--font-display);font-size:15px;color:var(--ink);font-weight:700}
.gear-x{border:none;background:none;font-size:15px;cursor:pointer;color:var(--muted);width:28px;height:28px;border-radius:6px;line-height:1}
.gear-x:hover{background:var(--paper3);color:var(--ink)}
.gear-bd{padding:14px 18px;overflow-y:auto}
.gear-sec{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.14em;color:var(--accent);margin:14px 0 8px;text-transform:uppercase}
.gear-sec:first-child{margin-top:0}
.gear-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.gear-f{display:flex;flex-direction:column;gap:4px;min-width:0}
.gear-f label{font-size:11.5px;color:var(--muted);font-weight:500}
.gear-f input,.gear-bd textarea{border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px;background:var(--paper2);color:var(--ink);font-family:inherit;outline:none;transition:border-color .15s;box-sizing:border-box;width:100%}
.gear-f input:focus,.gear-bd textarea:focus{border-color:var(--accent)}
.gear-f input[type=color]{height:38px;padding:3px;cursor:pointer}
.gear-f select.act-sel{width:100%;padding:8px 10px;border-radius:8px;font-size:13px;background:var(--paper2);border-color:var(--line)}
.gear-bd textarea{resize:vertical;line-height:1.6}
.gear-ft{font-size:10.5px;color:var(--muted);opacity:.85;line-height:1.5}
.gear-ft2{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--line);flex:none}
.gear-cancel,.gear-save{border-radius:var(--r);padding:8px 16px;font-size:13px;cursor:pointer;font-family:inherit}
.gear-cancel{background:transparent;border:1px solid var(--line);color:var(--primary)}
.gear-cancel:hover{background:var(--paper3)}
.gear-save{background:var(--accent);border:1px solid var(--accent);color:#FBF7EE;font-weight:600;transition:filter .15s}
.gear-save:hover{filter:brightness(1.07)}
@media(max-width:560px){.gear-grid{grid-template-columns:1fr}.bos-jump{grid-template-columns:repeat(2,1fr)}.bos-meta{display:none}}
/* 恢复自动同步悬浮按钮（授权过期兜底，日常不显示） */
#sync-revive{position:fixed;right:16px;bottom:16px;z-index:9999;background:var(--accent);color:#fff;border:none;border-radius:18px;padding:9px 18px;font-size:13px;font-weight:600;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.18)}
#sync-revive:hover{filter:brightness(1.08)}

function p2(n){return String(n).padStart(2,'0')}
function todayStr(){const d=new Date();return`${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`}
function offsetDate(b,n){const d=new Date(b+'T00:00:00');d.setDate(d.getDate()+n);return`${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`}
function totalMacros(items){return items.reduce((a,i)=>({kcal:a.kcal+i.kcal,carbs:a.carbs+i.carbs,protein:a.protein+i.protein,fat:a.fat+i.fat,fiber:a.fiber+(i.fiber||0),va:a.va+(i.va||0),vb1:a.vb1+(i.vb1||0),vb2:a.vb2+(i.vb2||0),niacin:a.niacin+(i.niacin||0),ve:a.ve+(i.ve||0),na:a.na+(i.na||0),ca:a.ca+(i.ca||0),fe:a.fe+(i.fe||0),vc:a.vc+(i.vc||0),chol:a.chol+(i.chol||0),mg:a.mg+(i.mg||0),zn:a.zn+(i.zn||0),ka:a.ka+(i.ka||0),mn:a.mn+(i.mn||0),cu:a.cu+(i.cu||0),se:a.se+(i.se||0),ph:a.ph+(i.ph||0)}),{kcal:0,carbs:0,protein:0,fat:0,fiber:0,va:0,vb1:0,vb2:0,niacin:0,ve:0,na:0,ca:0,fe:0,vc:0,chol:0,mg:0,zn:0,ka:0,mn:0,cu:0,se:0,ph:0})}
function dayTotal(ds){const d=getDayData(ds);return totalMacros([...d.breakfast,...d.lunch,...d.dinner,...d.snack])}
function calcN(f,g){return{kcal:+(f.pg.k*g).toFixed(1),carbs:+(f.pg.c*g).toFixed(1),protein:+(f.pg.p*g).toFixed(1),fat:+(f.pg.f*g).toFixed(1),fiber:+(f.pg.fi*g).toFixed(1),va:+(f.pg.va*g).toFixed(1),vb1:+(f.pg.vb1*g).toFixed(2),vb2:+(f.pg.vb2*g).toFixed(2),niacin:+(f.pg.niacin*g).toFixed(1),ve:+(f.pg.ve*g).toFixed(2),na:+(f.pg.na*g).toFixed(1),ca:+(f.pg.ca*g).toFixed(1),fe:+(f.pg.fe*g).toFixed(2),vc:+(f.pg.vc*g).toFixed(1),chol:+(f.pg.chol*g).toFixed(1),mg:+(f.pg.mg*g).toFixed(1),zn:+(f.pg.zn*g).toFixed(2),ka:+(f.pg.ka*g).toFixed(1),mn:+(f.pg.mn*g).toFixed(2),cu:+(f.pg.cu*g).toFixed(2),se:+(f.pg.se*g).toFixed(2),ph:+(f.pg.ph*g).toFixed(1)}}
function macroPcts(t){const cK=t.carbs*4,pK=t.protein*4,fK=t.fat*9,T=cK+pK+fK||1;return{c:Math.round(cK/T*100),p:Math.round(pK/T*100),f:Math.round(fK/T*100)}}
function calcBMR(g,w,h,a){return g==='female'?10*w+6.25*h-5*a-161:10*w+6.25*h-5*a+5}
function calcPresets(bmr,act){const tdee=Math.round(bmr*act);function m(k,rc,rp,rf){return{kcal:k,carbs:Math.round(k*rc/4),protein:Math.round(k*rp/4),fat:Math.round(k*rf/9)}}return[{key:'fat',name:'减脂',icon:'🔥',macros:m(Math.round(tdee*.8),.40,.30,.30)},{key:'maintain',name:'维持',icon:'⚖️',macros:m(tdee,.50,.25,.25)},{key:'muscle',name:'增肌',icon:'💪',macros:m(Math.round(tdee*1.12),.45,.30,.25)}]}

<script>
// ── 全局错误捕获：崩了不再白屏，直接把错误显示在页面顶部 ──

function ico(n,s){s=s||16;return'<svg class="ic" width="'+s+'" height="'+s+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#i-'+n+'"/></svg>'}
const MEALS=[{id:'breakfast',name:'早餐',icon:ico('sunrise',13),color:'#fff3cd'},{id:'lunch',name:'午餐',icon:ico('sun',13),color:'#d4edda'},{id:'dinner',name:'晚餐',icon:ico('moon',13),color:'#cce5ff'},{id:'snack',name:'零食',icon:ico('cookie',13),color:'#f8d7da'}];

function generateData(){const d={};const t=todayStr();for(let i=29;i>=0;i--){const ds=offsetDate(t,-i);const tp=TPLS[i%TPLS.length];d[ds]={breakfast:JSON.parse(JSON.stringify(tp.breakfast)),lunch:JSON.parse(JSON.stringify(tp.lunch)),dinner:JSON.parse(JSON.stringify(tp.dinner)),snack:JSON.parse(JSON.stringify(tp.snack))}}return d}

let CUSTOM_FOOD_DB=JSON.parse(localStorage.getItem('nutrilog_custom')||'[]').map(f=>(f.pg||{k:f.kcal/(f.base_g||100),c:f.carbs/(f.base_g||100),p:f.protein/(f.base_g||100),f:f.fat/(f.base_g||100),fi:(f.fiber||0)/(f.base_g||100),na:(f.na||0)/(f.base_g||100)},f.fiber=f.fiber||0,f.c='自定义',f));

// ── 本地文件自动保存（File System Access API） ──────
let FILE_HANDLE=null;
let FILE_NAME='';
// 用 IndexedDB 持久化文件句柄
function openFileDB(){return new Promise((rs,rj)=>{const r=indexedDB.open('NutrilogFS',1);r.onupgradeneeded=()=>r.result.createObjectStore('handles');r.onsuccess=()=>rs(r.result);r.onerror=()=>rj(r.error)})}
function saveHandleToDB(handle,key='fileHandle'){openFileDB().then(db=>{const tx=db.transaction('handles','readwrite');tx.objectStore('handles').put(handle,key);tx.oncomplete=()=>db.close()}).catch(()=>{})}
function loadHandleFromDB(key='fileHandle'){return openFileDB().then(db=>new Promise((rs,rj)=>{const tx=db.transaction('handles','readonly');const req=tx.objectStore('handles').get(key);req.onsuccess=()=>{db.close();rs(req.result)};req.onerror=()=>{db.close();rj(null)}})).catch(()=>null)}
async function saveToFile(){
  if(!FILE_HANDLE) return;
  try{
    const pkg=buildBackupPkg(); /* v3 三域结构，与首页导出/导入同一路径 */
    const w=await FILE_HANDLE.createWritable();
    await w.write(JSON.stringify(pkg,null,2));
    await w.close();
    const f=await FILE_HANDLE.getFile();
    _lastFileMod=f.lastModified; /* 更新监听基线，防止把自己写入的变化误当外部变化 */
  }catch(e){console.warn('文件保存失败',e)}
}
async function loadFromFile(handle){
  try{
    const file=await handle.getFile();
    const text=await file.text();
    const pkg=JSON.parse(text);
    if(!pkg.version) return false;
    applyImportPkg(pkg); /* v3/v2 双兼容统一走 applyImportPkg（含身体/训练域），此前手工解析漏 v3 三域 */
    return true;
  }catch(e){return false}
}
/* 备份文件监听自动重载（2026-09-04 公主拍板即刻实现）：
   每 30 秒静默检查备份文件修改时间——外部写入（如第三方工具更新数据）检测到变化
   即自动重载数据并刷新，开着的工作台无需手动刷新即可吸收最新数据。纯本地 IO，零 token。
   _lastFileMod 防自触：自己 saveToFile 写入后更新基线，不把自己写的变化当外部变化。 */
let _lastFileMod=0;
async function watchBackupFile(){
  if(!FILE_HANDLE)return;
  try{
    if(await FILE_HANDLE.queryPermission({mode:'readwrite'})!=='granted')return;
    const file=await FILE_HANDLE.getFile();
    if(file.lastModified>_lastFileMod){
      const hadBaseline=_lastFileMod>0;
      _lastFileMod=file.lastModified;
      if(hadBaseline){
        const loaded=await loadFromFile(FILE_HANDLE);
        if(loaded)render();
      }
    }
  }catch(e){}
}
setInterval(watchBackupFile,30000);
/* 未授权兜底：无手势时 requestPermission 返回 prompt，挂悬浮按钮，点击即授权（借用户手势）。
   Edge 122+ 持久授权下日常不会出现——只在权限真断时显示。 */
let PENDING_HANDLE=null;
function showSyncRevive(handle){
  PENDING_HANDLE=handle;
  if(document.getElementById('sync-revive'))return;
  const el=document.createElement('button');
  el.id='sync-revive';
  el.textContent='🔄 恢复自动同步';
  el.title='点击授权自动保存与自动刷新（每台电脑仅需一次）';
  el.onclick=async()=>{
    const h=PENDING_HANDLE;if(!h)return;
    try{
      const ok=await h.requestPermission({mode:'readwrite'});
      if(ok==='granted'){
        FILE_HANDLE=h;FILE_NAME=h.name;saveHandleToDB(h);
        const loaded=await loadFromFile(h);
        const f=await h.getFile();_lastFileMod=f.lastModified;
        el.remove();if(loaded)render();
      }else el.remove();
    }catch(e){el.remove()}
  };
  document.body.appendChild(el);
}
// 启动同步：http 来源优先探测服务器模式（零权限零点击）；file:// 走 FILE_HANDLE 文件链路
(function bootSync(){
  function initFileChain(){
    loadHandleFromDB().then(async handle=>{
      if(!handle) return;
      try{
        let ok=await handle.queryPermission({mode:'readwrite'});
        if(ok!=='granted') ok=await handle.requestPermission({mode:'readwrite'});
        if(ok==='granted'){
          FILE_HANDLE=handle;
          FILE_NAME=handle.name;
          const loaded=await loadFromFile(handle);
          const f=await handle.getFile();
          _lastFileMod=f.lastModified; /* 建立监听基线，防止本次恢复被监听误判为外部变化 */
          if(loaded){render();console.log('✅ 已从本地文件恢复数据:',FILE_NAME)}
        }else{
          showSyncRevive(handle);
        }
      }catch(e){}
    });
  }
  initFileChain();
})();
// 启动时恢复同步句柄
let SYNC_HANDLE=null,SYNC_NAME='';
loadHandleFromDB('syncHandle').then(async handle=>{

S.presets=calcPresets(calcBMR(S.body.gender,S.body.weight,S.body.height,getAge()),S.body.act);

// 数据迁移：旧 age → birthYear
(function(){
  if(S.body.age!==undefined && S.body.birthYear===undefined){

// 数据迁移：给旧数据补上缺失的微量字段
(function migrateData(){
  const MICRO_FIELDS={va:0,vb1:0,vb2:0,niacin:0,ve:0,na:0,ca:0,fe:0,vc:0,chol:0,mg:0,zn:0,ka:0,mn:0,cu:0,se:0,ph:0,fiber:0};
  let changed=false;
  Object.keys(S.data).forEach(ds=>{
    const day=S.data[ds];
    MEALS.forEach(m=>{
      (day[m.id]||[]).forEach(item=>{
        Object.keys(MICRO_FIELDS).forEach(k=>{
          if(item[k]===undefined){item[k]=MICRO_FIELDS[k];changed=true}
        });
        if(item._pg){
          Object.keys(MICRO_FIELDS).forEach(k=>{
            if(item._pg[k]===undefined){item._pg[k]=0;changed=true}
          });
        }
      });
    });
  });
  if(changed) saveData();
})();

function saveData(){try{localStorage.setItem('nutrilog_data',JSON.stringify(S.data));localStorage.setItem('nutrilog_goals',JSON.stringify(S.goals));localStorage.setItem('nutrilog_body',JSON.stringify(S.body));localStorage.setItem('bosdiet_recent',JSON.stringify(S.recentFoods));localStorage.setItem('bos_body_log',JSON.stringify(S.bodyLog));localStorage.setItem('bos_training_log',JSON.stringify(S.trainingLog));if(S.cycleAnchor)localStorage.setItem('bos_cycle_anchor',JSON.stringify(S.cycleAnchor));localStorage.setItem('bos_settings',JSON.stringify(S.settings));localStorage.setItem('bos_habit_log',JSON.stringify(S.habitLog));localStorage.setItem('bos_week_log',JSON.stringify(S.weekLog));if(FILE_HANDLE) saveToFile()}catch(e){}}
function getDayData(ds){if(!S.data[ds])S.data[ds]={breakfast:[],lunch:[],dinner:[],snack:[]};MEALS.forEach(m=>{if(!S.data[ds][m.id])S.data[ds][m.id]=[]});return S.data[ds]}
function dateLabel(ds){const t=todayStr(),d=(new Date(ds)-new Date(t))/86400000;if(d===0)return'今天';if(d===-1)return'昨天';if(d===1)return'明天';const dd=new Date(ds+'T00:00:00');return`${dd.getMonth()+1}月${dd.getDate()}日`}
function shiftDate(n){const d=new Date(S.today+'T00:00:00');d.setDate(d.getDate()+n);S.today=`${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`;render()}

// visuals
function ring(eaten,goal){const R=46,cx=55,cy=55,circ=2*Math.PI*R,pct=Math.min(eaten/goal,1),col=pct>1?'var(--re)':pct>0.85?'var(--or)':'var(--g)';return`<svg width="110" height="110" viewBox="0 0 110 110"><circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="var(--color-border-tertiary)" stroke-width="9"/><circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="${col}" stroke-width="9" stroke-dasharray="${circ.toFixed(1)}" stroke-dashoffset="${(circ*(1-pct)).toFixed(1)}" stroke-linecap="round" transform="rotate(-90 ${cx} ${cy})"/></svg>`}
function mcBar(n,v,g,c){const p=Math.min(v/g*100,100).toFixed(1);return`<div class="mc"><span class="mc-name">${n}</span><div class="mc-bar"><div class="mc-fill" style="width:${p}%;background:${c}"></div></div><span class="mc-val" style="color:${c}">${Math.round(v)}/${g}g</span></div>`}
function stackedBar(tot){const mp=macroPcts(tot),has=tot.kcal>0;return`<div class="pct-section"><div class="pct-title">三大营养素热量占比</div><div class="stacked">${has?`<div class="seg" style="flex:${mp.c};background:var(--mc-c)">${mp.c>=12?mp.c+'%':''}</div><div class="seg" style="flex:${mp.p};background:var(--mc-p)">${mp.p>=12?mp.p+'%':''}</div><div class="seg" style="flex:${mp.f};background:var(--mc-f)">${mp.f>=12?mp.f+'%':''}</div>`:`<div class="seg" style="flex:1;background:var(--color-border-tertiary)"></div>`}</div><div class="pct-legend"><div class="pl"><div class="pl-dot" style="background:var(--mc-c)"></div><span class="pl-name">碳水</span><span style="font-weight:500">${Math.round(tot.carbs)}g</span><span style="font-size:10px;color:var(--color-text-secondary)">(${has?mp.c:'-'}%)</span></div><div class="pl"><div class="pl-dot" style="background:var(--mc-p)"></div><span class="pl-name">蛋白</span><span style="font-weight:500">${Math.round(tot.protein)}g</span><span style="font-size:10px;color:var(--color-text-secondary)">(${has?mp.p:'-'}%)</span></div><div class="pl"><div class="pl-dot" style="background:var(--mc-f)"></div><span class="pl-name">脂肪</span><span style="font-weight:500">${Math.round(tot.fat)}g</span><span style="font-size:10px;color:var(--color-text-secondary)">(${has?mp.f:'-'}%)</span></div></div>${has?`<div class="ideal">${ico('bulb',12)} 建议比例：碳水 45–65% · 蛋白 10–35% · 脂肪 20–35%</div>`:''}</div>`}

// search results (no DOM side effects)
function getFilteredFoods(){
  const q=S.search.trim();
  const all=[...FOOD_DB,...CUSTOM_FOOD_DB];
  const base=S.activeCat==='全部'?all:all.filter(f=>f.c===S.activeCat);
  if(!q)return base;
  const lq=q.toLowerCase();
  /* 一级：连续子串（菜名或分类），同时忽略英文大小写 */
  const exact=base.filter(f=>f.name.toLowerCase().includes(lq)||String(f.c||'').includes(q));
  if(exact.length)return exact;
  /* 二级：逐字全含，不要求连续——解决「鸡胸肉→鸡胸脯肉」「牛奶→牛乳」这类口语与成分表命名对不上 */
  const chars=[...new Set([...q])].filter(c=>c.trim());
  if(chars.length<2)return exact;
  /* 短名优先：搜「牛奶」时「牛乳（原料奶）」要压过「牛乳粉（婴儿奶粉）」这类长尾衍生项 */
  const fuzzy=base.filter(f=>chars.every(c=>f.name.includes(c)))
                  .sort((a,b)=>a.name.length-b.name.length);
  return fuzzy.length?fuzzy:exact;
}
function searchListHTML(){
  const list=getFilteredFoods();
  if(!list.length)return`<div class="empty-state">没有找到相关食物<br>可在「手动输入」里自定义添加</div>`;
  return list.map((f,i)=>{
    const dbIdx=FOOD_DB.indexOf(f);
    const isCustom=dbIdx===-1;
    const customIdx=isCustom?CUSTOM_FOOD_DB.indexOf(f):-1;

function renderLog(){

function renderReport(){
  const RANGES={week:{n:7,off:0,weekly:false},lastweek:{n:7,off:7,weekly:false},month:{n:30,off:0,weekly:true},lastmonth:{n:30,off:30,weekly:true}};
  const r=RANGES[S.reportRange]||RANGES.week;
  const isWeek=!r.weekly;
  const days=(()=>{const d=[];for(let i=r.n-1+r.off;i>=r.off;i--){const ds=offsetDate(S.today,-i),dd=new Date(ds+'T00:00:00');d.push({ds,label:`${dd.getMonth()+1}/${dd.getDate()}`,tot:dayTotal(ds)})}return d})();
  const logged=days.filter(d=>d.tot.kcal>0),totalDays=days.length,avg=k=>totalDays?Math.round(days.reduce((s,d)=>s+(d.tot[k]||0),0)/totalDays):0;
  const aK=avg('kcal'),aC=avg('carbs'),aP=avg('protein'),aF=avg('fat'),G=S.goals,maxK=Math.max(...days.map(d=>d.tot.kcal),G.kcal,1);
  const mp=macroPcts({kcal:aK||0,carbs:aC||0,protein:aP||0,fat:aF||0});
  let bars='';
  if(isWeek){days.forEach(d=>{const h=d.tot.kcal>0?Math.max(Math.round(d.tot.kcal/maxK*90),3):2,c=d.tot.kcal>G.kcal*1.15?'var(--rc-over)':d.tot.kcal>=G.kcal?'var(--rc-ok)':d.tot.kcal>0?'var(--rc-under)':'var(--color-border-tertiary)';bars+=`<div class="bc-col"><div class="bc-bar-wrap"><div class="bc-bar" style="height:${h}px;background:${c}${d.ds===todayStr()?';box-shadow:0 0 0 2px var(--or)':''}"></div></div><span class="bc-val">${d.tot.kcal>0?Math.round(d.tot.kcal):'-'}</span><span class="bc-label">${d.label}</span></div>`;});}
  else{const wks=[];for(let i=0;i<4;i++){const ch=days.slice(i*7,(i+1)*7),wl=ch.filter(d=>d.tot.kcal>0);wks.push({label:`第${i+1}周`,avg:wl.length?Math.round(wl.reduce((s,d)=>s+d.tot.kcal,0)/wl.length):0});}const wm=Math.max(...wks.map(w=>w.avg),G.kcal,1);wks.forEach(w=>{const h=w.avg>0?Math.max(Math.round(w.avg/wm*90),3):2,c=w.avg>G.kcal*1.15?'var(--rc-over)':w.avg>=G.kcal?'var(--rc-ok)':w.avg>0?'var(--rc-under)':'var(--color-border-tertiary)';bars+=`<div class="bc-col"><div class="bc-bar-wrap"><div class="bc-bar" style="height:${h}px;background:${c};margin:0 auto"></div></div><span class="bc-val">${w.avg||'-'}</span><span class="bc-label">${w.label}</span></div>`;});}
  function bp(c,p,f){const R=56,cx=66,cy=66;function arc(s,sw,col){if(sw<=0)return'';const a1=s*Math.PI/180,a2=(s+sw)*Math.PI/180,x1=cx+R*Math.cos(a1),y1=cy+R*Math.sin(a1),x2=cx+R*Math.cos(a2),y2=cy+R*Math.sin(a2);return`<path d="M${cx},${cy} L${x1.toFixed(2)},${y1.toFixed(2)} A${R},${R} 0 ${sw>180?1:0},1 ${x2.toFixed(2)},${y2.toFixed(2)} Z" fill="${col}"/>`}const s1=-90,s2=s1+c*3.6,s3=s2+p*3.6;return`<svg width="132" height="132" viewBox="0 0 132 132" class="macro-donut">${arc(s1,c*3.6,'var(--mc-c)')}${arc(s2,p*3.6,'var(--mc-p)')}${arc(s3,f*3.6,'var(--mc-f)')}<circle cx="${cx}" cy="${cy}" r="34" fill="var(--color-background-primary)"/><text x="${cx}" y="${cy-4}" text-anchor="middle" dominant-baseline="middle" fill="var(--ink)" font-size="14" font-weight="600">${Math.round(c+p+f)||'—'}%</text></svg>`}
  function mr(n,v,g,c){const p=Math.min((v||0)/g*100,100).toFixed(1);return`<div style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;font-size:11px;margin-bottom:3px"><span style="color:var(--color-text-secondary)">${n}</span><span style="color:${c};font-weight:500">${Math.round(v||0)}g/${g}g</span></div><div style="height:7px;background:var(--color-border-tertiary);border-radius:4px;overflow:hidden"><div style="height:100%;width:${p}%;background:${c};border-radius:4px"></div></div></div>`}
  return`<div class="report-nav"><button class="rnav ${S.reportRange==='lastweek'?'active':''}" onclick="S.reportRange='lastweek';S.dietTab='report';render()">上周</button><button class="rnav ${S.reportRange==='week'?'active':''}" onclick="S.reportRange='week';S.dietTab='report';render()">本周</button><button class="rnav ${S.reportRange==='lastmonth'?'active':''}" onclick="S.reportRange='lastmonth';S.dietTab='report';render()">上月</button><button class="rnav ${S.reportRange==='month'?'active':''}" onclick="S.reportRange='month';S.dietTab='report';render()">本月</button><button class="today-btn" onclick="S.dietTab='report';S.today=todayStr();render()" style="margin-left:auto">今天</button></div>
  <div class="stat-grid"><div class="stat-card"><div class="stat-label">平均热量</div><div class="stat-val" style="color:var(--primary)">${aK}<span style="font-size:11px;font-weight:400"> 千卡</span></div></div><div class="stat-card"><div class="stat-label">记录天数</div><div class="stat-val" style="color:var(--primary)">${logged.length}<span style="font-size:11px;font-weight:400"> 天</span></div></div><div class="stat-card"><div class="stat-label">达标率</div><div class="stat-val" style="color:var(--primary)">${logged.length?Math.round(logged.filter(d=>Math.abs(d.tot.kcal-G.kcal)<G.kcal*.15).length/logged.length*100):0}<span style="font-size:11px;font-weight:400"> %</span></div></div></div>

document.getElementById('root').addEventListener('click',function(e){

    const text=document.getElementById('cf-parse-inp')?.value.trim();
    if(!text){alert('请粘贴营养数据');return}
    const parts=text.split(/\s+/);
    const name=parts[0];
    if(!name){alert('请以食物名称开头');return}
    const full=text;
    // 自动识别份量单位（食物名后的第一个数字+克/g）
    let unit='100g';
    const unitMatch=full.match(/^\s*\S+\s+(\d+)\s*(?:克|g)\b/);
    if(unitMatch) unit=unitMatch[1]+'g';
    // 能量: 严格区分千卡/千焦
    let kcal=0;
    const kcalMatch=full.match(/(?:(?:千卡|kcal)\s*(\d+(?:\.\d+)?)|(\d+(?:\.\d+)?)\s*(?:千卡|kcal))/i);
    const kjMatch=full.match(/(?:(?:千焦|kJ|kj|KJ)\s*(\d+(?:\.\d+)?)|(\d+(?:\.\d+)?)\s*(?:千焦|kJ|kj|KJ))/);
    if(kcalMatch){kcal=parseFloat(kcalMatch[1]||kcalMatch[2])}
    else if(kjMatch){kcal=Math.round(parseFloat(kjMatch[1]||kjMatch[2])/4.184)}
    else{
      const enMatch=full.match(/能量\s*(\d+(?:\.\d+)?)/);
      if(enMatch){
        const val=parseFloat(enMatch[1]);
        const after=full.substring(enMatch.index+enMatch[0].length);
        if(after.match(/^\s*(?:千焦|kJ|kj)/i)){kcal=Math.round(val/4.184)}
        else{kcal=val}
      }

    const protein=parseFloat(full.match(/(?:蛋白质|蛋白)\s*(\d+(?:\.\d+)?)/)?.[1])||0;

    const na=parseFloat(full.match(/钠\s*(\d+(?:\.\d+)?)/)?.[1])||0;
    const ca=parseFloat(full.match(/钙\s*(\d+(?:\.\d+)?)/)?.[1])||0;
    const fe=parseFloat(full.match(/铁\s*(\d+(?:\.\d+)?)/)?.[1])||0;
    const va=parseFloat(full.match(/(?:维生素A|维A|VA)\s*(\d+(?:\.\d+)?)/i)?.[1])||0;
    const vc=parseFloat(full.match(/(?:维生素C|维C|VC)\s*(\d+(?:\.\d+)?)/i)?.[1])||0;
    const chol=parseFloat(full.match(/(?:胆固醇|胆)\s*(\d+(?:\.\d+)?)/)?.[1])||0;
    const vb1=parseFloat(full.match(/(?:维生素B1|维B1|VB1|硫胺素)\s*(\d+(?:\.\d+)?)/i)?.[1])||0;
    const vb2=parseFloat(full.match(/(?:维生素B2|维B2|VB2|核黄素)\s*(\d+(?:\.\d+)?)/i)?.[1])||0;
    const niacin=parseFloat(full.match(/(?:烟酸|尼克酸|VPP)\s*(\d+(?:\.\d+)?)/i)?.[1])||0;
    const mg=parseFloat(full.match(/(?:镁|Mg|mg)\s*(\d+(?:\.\d+)?)/)?.[1])||0;
  const zn=parseFloat(full.match(/(?:锌|Zn)\s*(\d+(?:\.\d+)?)/)?.[1])||0;
  const ka=parseFloat(full.match(/(?:钾|K|钾离子)\s*(\d+(?:\.\d+)?)/)?.[1])||0;
  const mn=parseFloat(full.match(/(?:锰|Mn)\s*(\d+(?:\.\d+)?)/)?.[1])||0;
  const cu=parseFloat(full.match(/(?:铜|Cu)\s*(\d+(?:\.\d+)?)/)?.[1])||0;
  const se=parseFloat(full.match(/(?:硒|Se)\s*(\d+(?:\.\d+)?)/)?.[1])||0;

  const ve=parseFloat(full.match(/(?:维生素E|维E|VE)\s*(\d+(?:\.\d+)?)/i)?.[1])||0;
    S.customForm={name,kcal:kcal||'',kj:'',carbs:carbs||'',protein:protein||'',fat:fat||'',fiber:fiber||'',unit,va:va||'',vb1:vb1||'',vb2:vb2||'',niacin:niacin||'',ve:ve||'',na:na||'',ca:ca||'',fe:fe||'',vc:vc||'',chol:chol||'',mg:mg||'',zn:zn||'',ka:ka||'',mn:mn||'',cu:cu||'',se:se||'',ph:ph||''};

    S.modal=mealId;

    render();

function fuzzyFindFood(name){
  let db=FOOD_DB.find(f=>f.name===name);
  if(db) return db;
  const matches=FOOD_DB.filter(f=>f.name.includes(name));
  if(matches.length===1) return matches[0];
  if(matches.length>1) return matches.reduce((a,b)=>a.name.length<=b.name.length?a:b);
  const partial=FOOD_DB.filter(f=>name.includes(f.name));
  if(partial.length) return partial.reduce((a,b)=>a.name.length>=b.name.length?a:b);
  const c=CUSTOM_FOOD_DB.find(f=>f.name===name||f.name.includes(name));
  return c||null;
}
function parseBatchText(t){
  const items=[];
  // 全局匹配 "食物名+数字+克/g"，不依赖分隔符
  const re=/(.+?)(\d+)([克g])/g;
  let m;
  while((m=re.exec(t))!==null){
    const name=m[1].trim(),grams=parseInt(m[2]);
    if(name&&grams>0){
      const db=fuzzyFindFood(name);
      if(db){
        const n=calcN(db,grams);
        items.push({name:db.name,unit:`${grams}g`,kcal:n.kcal,carbs:n.carbs,protein:n.protein,fat:n.fat,fiber:n.fiber,va:n.va,vb1:n.vb1,vb2:n.vb2,niacin:n.niacin,ve:n.ve,na:n.na,ca:n.ca,fe:n.fe,vc:n.vc,chol:n.chol,mg:n.mg,zn:n.zn,ka:n.ka,mn:n.mn,cu:n.cu,se:n.se,ph:n.ph});
      } else items.push({name,grams,notFound:true});
    }
  }
  return items;
}

/* v3 全量备份 = 三域：身体（bodyLog+cycleAnchor+基础信息）/ 训练（trainingLog）/ 饮食（data+goals+自定义食物/餐+最近）。
   评估不导（由身体域实时计算）；齿轮设置/待办/习惯打卡/周计划打卡按公主拍板不导。 */
function buildBackupPkg(){
  return {
    version:3,
    exported:new Date().toISOString(),
    body:{bodyLog:S.bodyLog,cycleAnchor:S.cycleAnchor,profile:S.body},
    training:{trainingLog:S.trainingLog},
    diet:{data:S.data,goals:S.goals,customFoods:CUSTOM_FOOD_DB,recentFoods:S.recentFoods,customMeals:S.customMeals},
    settings:S.settings
  };
}
/* 上次备份档案（浏览器沙箱拿不到磁盘路径，只记文件名+时间；句柄丢失时仍能告诉用户该找哪个文件） */
function fmtBackupTime(iso){const d=new Date(iso);if(isNaN(d))return '';
  const p=n=>String(n).padStart(2,'0');
  const t=`${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
  const diff=(Date.now()-d.getTime())/86400000;
  return diff<1?t+`（今天）`:diff<2?t+`（昨天）`:t+`（${Math.floor(diff)} 天前）`;}
function markBackup(name){
  try{localStorage.setItem('bos_last_backup',JSON.stringify({name:name||FILE_NAME||'',time:new Date().toISOString()}))}catch(e){}}
function lastBackup(){try{return JSON.parse(localStorage.getItem('bos_last_backup')||'null')}catch(e){return null}}
/* 导出备份（全站唯一导出入口）：三层智能——
   ① 已有备份文件（FILE_HANDLE）：点击直接静默写入该文件，不用想上次导出的在哪（公主拍板 2026-09-04）；
   ② 无句柄且浏览器支持（桌面 Chrome/Edge）：弹系统「另存为」对话框，文件夹/文件名用户自选，选完建立自动保存句柄；
   ③ 其他浏览器（含手机）：普通下载快照。用户取消对话框则静默返回。 */
async function exportData(){
  const pkg=buildBackupPkg();
  if(FILE_HANDLE){
    try{
      if(await FILE_HANDLE.queryPermission({mode:'readwrite'})==='granted'){
        const w=await FILE_HANDLE.createWritable();
        await w.write(JSON.stringify(pkg,null,2));
        await w.close();
        markBackup(FILE_NAME);
        render();
        return;
      }
    }catch(e){console.warn('备份文件写入失败（可能被移动/删除），转另存为',e);}
  }
  if(window.showSaveFilePicker){
    try{
      const handle=await window.showSaveFilePicker({suggestedName:`BOS身体风控工作台_备份_${todayStr()}.json`,types:[{description:'JSON',accept:{'application/json':['.json']}}]});
      FILE_HANDLE=handle;
      FILE_NAME=handle.name;
      saveHandleToDB(handle);
      const w=await handle.createWritable();
      await w.write(JSON.stringify(pkg,null,2));
      await w.close();
      markBackup(handle.name);
      render();
      return;
    }catch(e){if(e.name!=='AbortError')console.warn('另存为失败，退回普通下载',e);else return;}
  }
  /* 兜底下载：无 showSaveFilePicker 的环境（QQ浏览器实测可用但过程弹「blob 链接打开方式」选择窗，
     文件仍能落地；手机浏览器正常下载；内嵌 webview 可能真失败）——桌面端给出准确说明 */
  const fname=`BOS身体风控工作台_备份_${todayStr()}.json`;

    if(pkg.body){S.bodyLog=pkg.body.bodyLog||{};S.cycleAnchor=pkg.body.cycleAnchor||null;if(pkg.body.profile)S.body=pkg.body.profile}
    if(pkg.training&&pkg.training.trainingLog){S.trainingLog=pkg.training.trainingLog;for(const _d in S.trainingLog)S.trainingLog[_d]=normTraining(S.trainingLog[_d]);}
    if(pkg.diet){S.data=pkg.diet.data||{};if(pkg.diet.goals)S.goals=pkg.diet.goals;if(pkg.diet.customFoods){CUSTOM_FOOD_DB=pkg.diet.customFoods;localStorage.setItem('nutrilog_custom',JSON.stringify(CUSTOM_FOOD_DB))}if(pkg.diet.recentFoods)S.recentFoods=pkg.diet.recentFoods;if(pkg.diet.customMeals)S.customMeals=pkg.diet.customMeals}
    if(pkg.settings)S.settings=Object.assign(bosDefaultSettings(),pkg.settings);
  }else{
    /* v2 旧格式（仅饮食域）兼容 */
    S.data=pkg.data||{};
    if(pkg.goals) S.goals=pkg.goals;
    if(pkg.body) S.body=pkg.body;

/* ── 训练计划粘贴解析（任意分化通用入口）──
   一行一动作，兼容写法：`深蹲 5x5 80kg` / `5×5@80` / `80kg 5x5` / `3x8`（重量留空）。
   解析不出组次的行按默认 3 组兜底导入，# 开头的行忽略（兼容从模板区整块复制）。 */
function parseTrainLines(text){
  /* 两遍解析：
     Pass1 逐行提取 {name,sets,reps,weight,matched}（matched=识别出组次或重量）；
     Pass2 语义合并：动作名单独一行 + 下面只写重量的行 → 自动归到该动作名下（同一动作多重量组段）；
     裸名字行若下一行无法继承（next 有自己的名字或没有 next）→ 3 组兜底独立成条。 */
  const rows=String(text||'').split('\n').map(raw=>{
    let s=String(raw).trim();
    if(!s||/^#/.test(s))return null;
    s=s.replace(/[хХＸ✕X]/g,'x'); /* 误输入乘号归一化（大写 X/西里尔 х/全角Ｘ/✕ → ASCII x），不影响中文 */
    let weight=null;
    s=s.replace(/(\d+(?:\.\d+)?)\s*kg/ig,(mm,w)=>{weight=+w;return ' ';});
    let sets=3,reps=null,matched=false;
    // 三段式优先：严格按 重量x组x次数（如 80x5x5）；i flag 兜底任何大小写变体
    const t3=s.match(/(\d+(?:\.\d+)?)\s*[x×*]\s*(\d+)\s*[x×*]\s*(\d+(?:\.\d+)?)/i);
    if(t3){
      weight=+t3[1];sets=+t3[2];reps=+t3[3];
      s=s.slice(0,t3.index)+' '+s.slice(t3.index+t3[0].length);
      matched=true;
    }else{
      const m=s.match(/(\d+)\s*[x×*]\s*(\d+)(?:\s*[x×*@]\s*(\d+(?:\.\d+)?))?/i);
      if(m){
        sets=+m[1];reps=+m[2];
        if(m[3]&&weight==null)weight=+m[3];
        s=s.slice(0,m.index)+' '+s.slice(m.index+m[0].length);
        matched=true;
      }
    }
    if(weight==null){const w2=s.match(/\s(\d+(?:\.\d+)?)\s*$/);if(w2){weight=+w2[1];s=s.slice(0,w2.index);matched=true}}
    s=s.replace(/[@×x*]/ig,' ').replace(/\s+/g,' ').trim().replace(/^[-·•:：,，、]+\s*/,'');
    /* 兜底防线：名字残骸含数字且无中文无字母（如未知字符致 4X4 → 「4 4」「4?4」）说明其实是重量行，清空残名走继承 */
    if(!matched&&/\d/.test(s)&&!/[a-zA-Z\u4e00-\u9fa5]/.test(s)){matched=true;s='';}
    if(!s&&weight==null&&!matched)return null;
    return {name:s,sets:Math.min(Math.max(sets,1),20),reps:reps!=null?String(reps):'',weight:weight!=null?String(weight):'',matched};
  }).filter(Boolean);
  const out=[];let pending='';
  rows.forEach((r,i)=>{
    const next=rows[i+1];
    if(r.matched){
      if(r.name)pending=r.name;
      const name=r.name||pending;
      if(!name)return; /* 无名且无上文可继承 → 丢弃 */
      out.push({name,sets:r.sets,reps:r.reps,weight:r.weight,rpe:''});
    }else if(r.name){
      if(next&&next.matched&&!next.name){pending=r.name;} /* 名字被下一行继承，不独立成条 */
      else out.push({name:r.name,sets:r.sets,reps:r.reps,weight:r.weight,rpe:''});
    }
  });
  return out;
}

    if(/^#/.test(line)){
      if(cur&&cur.lines.trim())out.push(cur);

function calcPresets(bmr,act){const tdee=Math.round(bmr*act);function m(k,rc,rp,rf){return{kcal:k,carbs:Math.round(k*rc/4),protein:Math.round(k*rp/4),fat:Math.round(k*rf/9)}}return[{key:'fat',name:'减脂',icon:ico('flame',15),macros:m(Math.round(tdee*.8),.40,.30,.30)},{key:'maintain',name:'维持',icon:ico('scale',15),macros:m(tdee,.50,.25,.25)},{key:'muscle',name:'增肌',icon:ico('trend',15),macros:m(Math.round(tdee*1.12),.45,.30,.25)}]}

/* 围度沿用：腰围/臀围不天天量——d 当天有值用之；否则向前找最近一次测量。公主规矩：保留旧数据直到有新记录 */
function lastGirth(d,key){const td=new Date(d+'T00:00:00').getTime();const ks=Object.keys(S.bodyLog).sort().reverse();for(const x of ks){const xt=new Date(x+'T00:00:00').getTime();if(!isNaN(xt)&&xt<=td){const v=parseFloat((S.bodyLog[x]||{})[key]);if(v>0)return{ds:x,v}}}return{ds:null,v:0}}
/* 活跃日归集（2026-09-10 定）：跨午夜录入必须落到正确的那天，禁止按自然日硬写
   判据 = 当天这一觉是否已闭合（wake 与 bed 都有值）
   lme 末餐结束 / bed 上床：当天已闭合 → 这餐、这觉属于下一条 → 归下一天；否则归当天
   ms  进餐开始：醒来后第一餐 → 归最近一次 wake 所在日（最多回溯 3 天）
   其余字段：一律归当前选中日 */
function resolveWriteDay(f){
  const t=S.today,b=S.bodyLog[t]||{};
  if(f==='lme'||f==='bed')return (b.wake&&b.bed)?offsetDate(t,1):t;
  if(f==='ms'){
    if(b.wake)return t;
    for(let i=1;i<=3;i++){const d=offsetDate(t,-i);if((S.bodyLog[d]||{}).wake)return d;}
    return t;
  }
  return t;
}
function dayTag(f){const d=resolveWriteDay(f);return d===S.today?'':`<span style="font-size:10px;font-weight:400;color:#FF6B00"> →归入${d.slice(5)}</span>`}

  S.bodyLog[d][f]=v;
  if(f==='bed'||f==='wake'){const b=getBody(d);S.bodyLog[d].sleep_dur=calcSleepDur(b.bed,b.wake);}
  if(f==='lme'||f==='ms'){const b=getBody(d);S.bodyLog[d].fasting=calcFasting(b.lme,b.ms);}
  calcBodyAuto(d);
  saveData();render();
}
function calcSleepDur(bed,wake){
  if(!bed||!wake)return '';
  const b=bed.split(':').map(Number),w=wake.split(':').map(Number);
  let bt=b[0]*60+b[1],wt=w[0]*60+w[1];if(wt<bt)wt+=1440;
  return ((wt-bt)/60).toFixed(2);
}
function calcFasting(lme,ms){
  if(!lme||!ms)return '';
  const l=lme.split(':').map(Number),m=ms.split(':').map(Number);
  let lt=l[0]*60+l[1],st=m[0]*60+m[1];if(st<lt)st+=1440;
  return ((st-lt)/60).toFixed(2);
}
function calcBodyAuto(d){
  const b=getBody(d);
  const sc=calcBosScore(b);
  S.bodyLog[d].body_score=sc.bos+'/'+sc.bosLabel;
}
function dayDiff(d1,d2){return Math.round((new Date(d1)-new Date(d2))/86400000)}
function calcCyclePhase(dateStr,anchor){
  if(!anchor||!anchor.start)return '';
  const start=anchor.start,dur=anchor.dur||5,clen=anchor.clen||28;
  const ds=dayDiff(dateStr,start);
  if(ds<0)return '';
  const cd=(ds%clen)+1;
  if(cd<=dur)return '经期第'+cd+'天';
  if(cd<=dur+8)return '卵泡期第'+(cd-dur)+'天';
  if(cd<=dur+10)return '排卵期';
  if(cd<=dur+17)return '黄体前期第'+(cd-dur-10)+'天';
  return '黄体后期第'+(cd-dur-17)+'天';
}
// 公主 BOS 评分（低阶复刻：开源版只算身体信号；完整版含经期×训练联动/疲劳累积）
function calcBosScore(d){
  function n(v){const x=parseFloat(v);return isNaN(x)||x<=0?0:x}
  const hr=n(d.hr),grip=n(d.grip),sleep_q=n(d.sleep_q),sleep_dur=n(d.sleep_dur);
  const rm=n(d.rm),rp=n(d.rp),td=n(d.td),pain=n(d.pain),cycle=d.cycle||'';
  const ds=sleep_dur>=9?10:sleep_dur>=8?9:sleep_dur>=7?8:sleep_dur>=6?6:sleep_dur>0?4:5;
  const sq=sleep_q?{1:2,2:4,3:6,4:8,5:10}[Math.round(sleep_q)]||0:5;
  const gs=grip?{1:2,2:4,3:6,4:8,5:10}[Math.round(grip)]||0:5;
  const hs=hr>=60&&hr<=72?10:hr>=73&&hr<=78?8:hr>=79&&hr<=82?6:hr>=83?4:hr>=50&&hr<60?9:hr>0?6:5;
  const recovery=Math.round((ds*0.25+sq*0.15+gs*0.30+hs*0.30)*10)/10;
  const tds=td?{1:2,2:4,3:6,4:8,5:10}[Math.round(td)]||0:5;
  const pc=pain===0?0:pain<=2?-0.5:pain<=4?-1:pain<=6?-2:-4;
  const cc=/经期.*(第[12])/.test(cycle)?-1:/经期/.test(cycle)?0:/卵泡|排卵/.test(cycle)?0.5:/黄体后/.test(cycle)?-0.5:/黄体/.test(cycle)?0:0;
  const readiness=Math.max(0,Math.round((rm*0.4+rp*0.4+tds*0.2+cc+pc)*10)/10);
  let risk=0;
  if(sleep_dur>0&&sleep_dur<6)risk+=2;
  if(grip>0&&grip<=3)risk+=2;
  if(hr>80)risk+=2;
  if(pain>=4)risk+=2;
  if(rm>0&&rm<=7)risk+=1;
  if(rp>0&&rp<=7)risk+=1;
  if(/黄体后/.test(cycle)&&td>0&&td<=2)risk+=1;
  const riskLevel=risk<=2?'低风险 <span class=\"dot g\"></span>':risk<=5?'中风险 <span class=\"dot y\"></span>':'高风险 <span class=\"dot r\"></span>';
  const bos=Math.max(1,Math.min(10,Math.round((recovery*0.5+readiness*0.4+(10-risk)*0.1)*10)/10));
  const bosLabel=bos>=9?'状态极佳':bos>=8?'状态良好':bos>=7?'状态正常':bos>=6?'需要观察':'建议恢复优先';
  return {recovery,readiness,risk,riskLevel,bos,bosLabel};
}
function setCycleAnchor(){
  const start=document.getElementById('cyc-start')?.value;
  const dur=parseInt(document.getElementById('cyc-dur')?.value)||5;
  const clen=parseInt(document.getElementById('cyc-clen')?.value)||28;
  if(!start){alert('请先填末次经期开始日期');return}
  S.cycleAnchor={start,dur,clen};
  localStorage.setItem('bos_cycle_anchor',JSON.stringify(S.cycleAnchor));
  const b=getBody(S.today);
  S.bodyLog[S.today].cycle=calcCyclePhase(S.today,S.cycleAnchor);
  render();
}
/* 腰臀比 WHR = 腰围÷臀围：优先当前输入，否则取最近一次记录。参考切点（WHO 腰臀比风险分级）：女 <0.80 低 / 0.80-0.85 中 / >0.85 高；男 <0.90 低 / 0.90-1.00 中 / >1.00 高 */
function whrInfo(d){
  const get=(k)=>{const v=parseFloat((S.bodyLog[d]||{})[k]);if(v>0)return v;const keys=Object.keys(S.bodyLog).sort().reverse();for(const ds of keys){const x=parseFloat((S.bodyLog[ds]||{})[k]);if(x>0)return x}return 0};
  const w=get('waist'),h=get('hip');
  if(!(w>0&&h>0))return null;
  const whr=Math.round(w/h*100)/100;
  const male=(S.body.gender||'female')==='male';
  const level=male?(whr<0.90?'low':whr<=1.00?'mid':'high'):(whr<0.80?'low':whr<=0.85?'mid':'high');
  const txt=male?'男性参考：<0.90 低 · 0.90-1.00 中 · >1.00 高':'女性参考：<0.80 低 · 0.80-0.85 中 · >0.85 高';
  const tip=male
    ?(level==='low'?'腹型脂肪风险低，保持训练频率。':level==='mid'?'腰臀比偏高提示内脏脂肪堆积，长期会增加 2 型糖尿病、脂肪肝与心血管疾病风险——盯住腰围。':'腰臀比过高（腹型肥胖）是 2 型糖尿病、高血压、冠心病、中风、脂肪肝的明确风险因素——从今天开始减腰围。')
    :(level==='low'?'腹型脂肪风险低，保持训练频率。':level==='mid'?'腰臀比偏高提示内脏脂肪堆积，长期会增加 2 型糖尿病、脂肪肝与心血管疾病风险——40 岁后雌激素重新分配，腰围先胖，盯住腰围。':'腰臀比过高（腹型肥胖）是 2 型糖尿病、高血压、冠心病、中风、脂肪肝的明确风险因素——围绝经期减脂，优先减腰围。');
  return {whr,level,txt,tip};
}
function whrLine(d){
  const i=whrInfo(d);
  if(!i)return '';
  const cls=i.level==='low'?'g':i.level==='mid'?'or':'bad';
  const lab=i.level==='low'?'低风险':i.level==='mid'?'中等风险':'偏高';
  return `<div class="whr-line" style="margin-top:8px;font-size:12px;color:var(--ink)"><b style="font-size:14px">腰臀比 WHR：<span style="color:var(--${cls})">${i.whr.toFixed(2)}</span></b><span style="color:var(--${cls});font-weight:600;margin-left:8px">${lab}</span><span style="color:var(--muted);margin-left:10px;font-size:10.5px">${i.txt}（腰围÷臀围，腹型肥胖信号）</span><div style="margin-top:5px;font-size:11.5px;color:var(--${cls})">${ico('bulb',12)} ${i.tip}</div><div style="margin-top:5px;font-size:11px;color:var(--muted);line-height:1.7"><span style="color:var(--or);font-size:15px;font-weight:700;vertical-align:-2px;margin-right:4px">⚠</span>健康风险提示：腰臀比升高（腹型肥胖）与 <b>2 型糖尿病、高血压、冠心病、中风、脂肪肝、代谢综合征</b>及部分癌症（结直肠癌、乳腺癌、子宫内膜癌）风险相关。研究显示腰臀比每升高 0.1，心血管疾病风险约上升 10%——腰围降一寸，这些风险降一串。</div></div>`;
}

function normTraining(t){t=t||{};if(!Array.isArray(t.plan))t.plan=[];if(t.bs==null)t.bs='';if(t.tc==null)t.tc='';if(!Array.isArray(t.techFeel))t.techFeel=[];if(!Array.isArray(t.postState))t.postState=[];if(t.note==null)t.note='';return t}

function trainAddItem(){const d=S.today;const t=getTraining(d);const name=(S.trainDraft.name||'').trim();if(!name){alert('先填动作名');return}const sets=parseInt(S.trainDraft.sets)||1;const it={name,sets,reps:S.trainDraft.reps||'',weight:S.trainDraft.weight||'',rpe:S.trainDraft.rpe||'',done:[]};for(let i=0;i<sets;i++)it.done.push(false);t.plan.push(it);S.trainDraft={name:'',sets:3,reps:8,weight:'',rpe:''};saveData();render()}
function trainRmItem(idx){const d=S.today;getTraining(d).plan.splice(idx,1);saveData();render()}

function trainItemEdit(i,f,v){const d=S.today;const t=getTraining(d);if(f==='sets'){const n=+v||1;t.plan[i].sets=n;const dn=t.plan[i].done;const nd=[];for(let k=0;k<n;k++)nd.push(dn[k]||false);t.plan[i].done=nd;}else t.plan[i][f]=v;saveData();render()}

}

// ── 满血版7天评估（锚点周期制：锚=用户第一条记录日，滚动7天为一期，第7天自动出评估，不按自然周） ──
/* 周期引擎：bosAnchor()=最早有记录的日期；bosCycle()= {anchor, n(已完成期数), dayIn(当前期第几天)}；
   评估窗口=最近一个已完成期的7天 [anchor+7(n-1), anchor+7n-1]，每满7天自动落一份新评估 */
function bosAnchor(){
  let min=null;const scan=d=>{if(d&&(!min||d<min))min=d};
  for(const d in S.bodyLog)scan(d);
  for(const d in S.trainingLog){const t=S.trainingLog[d];if(t&&t.plan&&t.plan.length)scan(d)}
  for(const d in S.data){try{const t=dayTotal(d);if(t&&t.kcal>0)scan(d)}catch(e){}}
  return min;
}
function bosCycle(){
  const a=bosAnchor();if(!a)return null;
  const ds=Math.round((new Date(S.today+'T00:00:00')-new Date(a+'T00:00:00'))/86400000);
  if(ds<0)return null;
  return {anchor:a,n:Math.floor(ds/7),dayIn:ds+1};
}
function bosCycleDays(a,c){return Array.from({length:7},(_,i)=>offsetDate(a,(c-1)*7+i))}   /* 第 c 期（1-based）的7个日期 */
function cycOf(a,d){return Math.floor(Math.round((new Date(d+'T00:00:00')-new Date(a+'T00:00:00'))/86400000)/7)+1} /* 日期→期号 */
/* 侧栏红点：新一期评估已生成且尚未查看（进入评估页即标记已读，下一期落地再亮） */
function assessNewAvail(){const cy=bosCycle();if(!cy||cy.n<1)return false;let seen=0;try{seen=parseInt(localStorage.getItem('bos_assess_seen')||'0',10)||0}catch(e){}return cy.n>seen}
function computeAssess(){
  const cy=bosCycle();
  if(!cy||cy.n<1){ /* 未满首期：不出评估、不判数据不足，只出倒计时 */
    let bodyDays=0;if(cy)for(let i=0;i<cy.dayIn;i++){if(S.bodyLog[offsetDate(cy.anchor,i)])bodyDays++}
    return {tooEarly:true,dayIn:cy?cy.dayIn:0,bodyDays};
  }
  const days=bosCycleDays(cy.anchor,cy.n);
  let bosSum=0,bosN=0,sleepSum=0,sleepN=0,trainDays=0,dietDays=0,bodyDays=0;
  days.forEach(d=>{
    const b=S.bodyLog[d];
    if(b){bodyDays++;if(b.body_score){const v=parseFloat(b.body_score);if(!isNaN(v)){bosSum+=v;bosN++}}if(b.sleep_dur){sleepSum+=parseFloat(b.sleep_dur);sleepN++}}
    const t=S.trainingLog[d];if(t&&t.plan&&t.plan.length)trainDays++;
    const dd=S.data[d];if(dd){const tot=dayTotal(d);if(tot.kcal>0)dietDays++;}
  });
  const avgBos=bosN?bosSum/bosN:null;
  const avgSleep=sleepN?sleepSum/sleepN:null;
  let level='green',label='状态良好',tips=[];
  if(avgBos!==null&&avgBos<6){level='red';label='建议恢复优先';tips.push('7天平均BOS偏低（'+avgBos.toFixed(1)+'），优先睡眠与恢复');}
  else if(avgSleep!==null&&avgSleep<6.5){level='red';label='睡眠欠账';tips.push('7天平均睡眠仅'+avgSleep.toFixed(1)+'h，先补觉');}
  else if((avgBos!==null&&avgBos<7.5)||(avgSleep!==null&&avgSleep<7)){level='yellow';label='需要观察';tips.push('指标在临界区，留意疲劳累积');}
  else if(avgBos===null&&avgSleep===null){level='yellow';label='数据不足';tips.push('这7天里有空档——记录越全，评估越准');}
  return {days,avgBos,avgSleep,trainDays,dietDays,bodyDays,level,label,tips,
    cyc:cy.n,cycStart:offsetDate(cy.anchor,(cy.n-1)*7),cycEnd:offsetDate(cy.anchor,cy.n*7-1)};
}

  const light=a.level==='green'?'g':a.level==='yellow'?'y':'r';

  /* 人文关怀层（按记录天数生成「看见句」，不指令、不说教，带称呼） */
  const care=(nm?nm+'，':'')+(

  h+=renderPsy();

    <div class="cta-actions"><div class="cta-line">一对一个性化系统化训练营养，联系K哥</div><div class="cta-line">抖音搜「${BOS_CONFIG.douyin}」看健身科普</div><div class="cta-line">微信：${BOS_CONFIG.wechat}（注明来意）</div></div>

/* ── 神经驱动 · 心理评估（开源版轻量版：自动信号 + 3 题手答 + slogan 结论）──
   测的是神经驱动状态（注意力/agency/动力性耗竭），不是情绪健康——临床词零出现 */
let _psyAns={};
/* 答案按周落盘（周一键=新卷）：本周内刷新/关浏览器不丢，跨周自动清空重新评估 */
try{const _po=JSON.parse(localStorage.getItem('bos_psy_ans')||'{}');const _pcy=bosCycle();if(_po&&_pcy&&_pcy.n>=1&&_po.cyc===_pcy.n)_psyAns=_po.ans||{}}catch(e){}
function psySave(){try{const _pcy=bosCycle();localStorage.setItem('bos_psy_ans',JSON.stringify({cyc:_pcy?_pcy.n:0,ans:_psyAns}))}catch(e){}}
function psySignals(){
  const _cy=bosCycle();
  const days=(_cy&&_cy.n>=1)?bosCycleDays(_cy.anchor,_cy.n):(()=>{const a=[];for(let i=6;i>=0;i--)a.push(offsetDate(S.today,-i));return a})();
  const tds=[];let gap=0,maxGap=0,diverge=false;
  days.forEach(d=>{const b=S.bodyLog[d];
    if(b){if(b.td!==undefined&&b.td!==''&&!isNaN(parseFloat(b.td)))tds.push(parseFloat(b.td));gap=0}else{gap++;if(gap>maxGap)maxGap=gap}
    if(b){const rm=parseFloat(b.rm),rp=parseFloat(b.rp),ro=parseFloat(b.ro);if(!isNaN(rm)&&!isNaN(rp)&&!isNaN(ro)&&ro<Math.min(rm,rp)-1)diverge=true}
  });
  const tdDrop=tds.length>=3&&tds[tds.length-3]>tds[tds.length-2]&&tds[tds.length-2]>tds[tds.length-1];
  return [
    {hit:tdDrop,on:'⚠ 训练欲望连降',off:'✓ 训练欲望平稳'},
    {hit:maxGap>=3,on:'⚠ 本周有记录断档',off:'✓ 记录无断档'},
    {hit:diverge,on:'⚠ 综合恢复掉但身体没垮',off:'✓ 身心恢复一致'}
  ];
}
function psyPick(q,v,el){
  _psyAns[q]=v;
  psySave();
  const row=el.parentNode;
  row.querySelectorAll('.psy-opt').forEach(x=>{x.style.background='#fff';x.style.color='#1f2328';x.style.borderColor='#d0d7de'});
  el.style.background='#FF6B00';el.style.color='#fff';el.style.borderColor='#FF6B00';
  psyCalc();
}
function psyVerdict(){
  if(Object.keys(_psyAns).length<3)return{bg:'#B4B2A9',v:'答完 3 题，30 秒出结论',q:'',foot:false};
  let score=0;for(const k in _psyAns)score+=_psyAns[k];
  psySignals().forEach(s=>{if(s.hit)score+=1});
  if(score<=2)return{bg:'#3B6D11',v:'驱动在线',q:'神经系统没毛病。你缺的从来不是意志力，是重量。',foot:true};
  if(score<=5)return{bg:'#BA7517',v:'信号干扰',q:'不是你变懒了——是你的神经系统在分流处理别的优先级。',foot:true};
  return{bg:'#A32D2D',v:'驱动保护性宕机',q:'身体扛得住重量，扛不动出门——这不是懒，是系统在强制降载。',foot:true};
}
function psyCalc(){
  const L=document.getElementById('psyLight'),V=document.getElementById('psyVerdict'),Q=document.getElementById('psyQuote'),F=document.getElementById('psyFoot');
  if(!L)return;
  const r=psyVerdict();

}
function renderPsy(){
  const nm=(S.body.careName||'').trim();

  const opt=(q,v,txt)=>{const sel=_psyAns[q]===v;return `<span class="psy-opt" onclick="psyPick(${q},${v},this)" style="display:inline-block;border:1.5px solid ${sel?'#FF6B00':'#d0d7de'};background:${sel?'#FF6B00':'#fff'};color:${sel?'#fff':'#1f2328'};border-radius:40px;padding:7px 16px;font-size:13px;margin:0 6px 8px 0;cursor:pointer;user-select:none">${txt}</span>`};

    <div>${opt(1,0,'动作和重量上')}${opt(1,1,'一半在想别的')}${opt(1,2,'基本在混时间')}</div>
    <div style="font-size:13px;font-weight:600;margin:14px 0 8px 0">Q2 · 「今天不想练」出现时，你</div>
    <div>${opt(2,0,'还是去了，练完庆幸')}${opt(2,1,'逼自己去的')}${opt(2,2,'直接跳过')}</div>
    <div style="font-size:13px;font-weight:600;margin:14px 0 8px 0">Q3 · 「身体没毛病但就是不想动」有几天</div>
    <div>${opt(3,0,'0 天')}${opt(3,1,'1-2 天')}${opt(3,2,'3 天以上')}</div>
    <div style="margin-top:18px;padding-top:14px;border-top:1.5px solid #d0d7de;display:flex;align-items:flex-start;gap:14px">
      <span id="psyLight" style="width:18px;height:18px;border-radius:50%;background:${pv.bg};display:inline-block;flex-shrink:0;margin-top:3px"></span>
      <div>
        <div id="psyVerdict" style="font-size:17px;font-weight:600">${pv.v}</div>
        <div id="psyQuote" style="font-size:13px;color:#57606a;margin-top:3px;line-height:1.6">${pv.q}</div>
        <div id="psyFoot" style="display:${pv.foot?'block':'none'};margin-top:10px;padding:10px 14px;background:#FCF6EE;border-radius:12px;font-size:12.5px;line-height:1.7;color:#7a6a55">${nm?nm+'，':''}无论灯是什么颜色——愿意花 30 秒看自己状态的人，已经是少数。多数人只会怪自己懒。</div>
      </div>
    </div>
  </div>`;
  return h;
}

function todoAdd(){const inp=document.getElementById('todo-inp');if(!inp)return;const v=(inp.value||'').trim();if(!v)return;const k=S.today;if(!S.todoLog[k])S.todoLog[k]=[];S.todoLog[k].push({t:v.slice(0,40),done:false});todoSave()}
function todoToggle(i){const arr=todoToday();if(arr[i]){arr[i].done=!arr[i].done;todoSave()}}
function todoRm(i){const arr=todoToday();if(arr[i]){arr.splice(i,1);todoSave()}}
function todoCard(){
  const arr=todoToday();
  const doneN=arr.filter(x=>x.done).length;
  let h=`<div class="snav-todo"><div class="snav-todo-hd">今日待办<span class="snav-todo-sub">前 2 条 = 今天最重要的 20%</span></div>`;
  h+=`<div class="snav-todo-add"><input id="todo-inp" maxlength="40" placeholder="如：19:30 练腿 45 分钟" onkeydown="if(event.key==='Enter')todoAdd()"><button onclick="todoAdd()" title="添加">＋</button></div>`;
  if(!arr.length)h+=`<div class="snav-todo-empty">还没写。把训练排在最前面，别让它被不重要的事挤掉。</div>`;
  arr.forEach((it,i)=>{
    h+=`<div class="snav-todo-it ${i<2?'top':''} ${it.done?'done':''}"><button class="snav-todo-chk" onclick="todoToggle(${i})" title="完成">${it.done?'✓':''}</button><span class="snav-todo-txt">${esc(it.t)}</span><button class="snav-todo-rm" onclick="todoRm(${i})" title="删除">×</button></div>`;
  });
  if(arr.length)h+=`<div class="snav-todo-foot">${doneN}/${arr.length} 完成</div>`;
  h+=`</div>`;
  return h;
}

function bosSuggestion(){

  const bodyRec=!!(b&&b.body_score);

  if(!bodyRec)return{tab:'body',act:'去记录',text:'身体信号还没记。心率、睡眠、晨僵——<b>10 秒</b>先给身体打个分。'};
  if(planPending)return{tab:'training',act:'去打卡',text:'今天的训练还没打完卡，练完回来补上。'};

}
function trendRng(s){

  return `${f(s.lo)}–${f(s.hi)} ${u}`;
}

/* 演示数据：60 天睡眠/热量/腰围/臀围，点亮四指标曲线。静默填充无 confirm——
   首次打开自动填入（装上即见完整效果，公主拍板 2026-09-04），看完走评估页底部「恢复出厂」正式使用 */
function bosSeedDemo(){
  const N=60;
  for(let i=N-1;i>=0;i--){
    const d=new Date();d.setDate(d.getDate()-i);
    const ds=dstr(d);
    const dow=d.getDay();
    // 睡眠：7.3 基线 + 周末稍长 + 缓慢趋势 + 噪声
    const sleep=+(7.3+(dow===0||dow===6?0.5:-0.1)+Math.sin(i/5)*0.5+(Math.sin(i*7.3)*0.4)+((Math.random()-0.5)*0.5)).toFixed(2);
    const bl=Object.assign({},S.bodyLog[ds],{sleep_dur:sleep});
    // 腰围/臀围：整体缓降 + 周内抖动（模拟测量误差）
    bl.waist=+(75.0-(N-i)*0.055+Math.sin(i/3.1)*0.35).toFixed(1);
    bl.hip=+(98.5-(N-i)*0.03+Math.sin(i/3.7)*0.4).toFixed(1);
    S.bodyLog[ds]=bl;
    // 热量：按周日循环 + 噪声，落在 1500~2400 合理区间；写入今日三餐
    if(!S.data[ds])S.data[ds]={breakfast:[],lunch:[],dinner:[],snack:[]};
    const base=[2100,1850,2250,1780,2050,2400,1500][dow]||2000;
    const kcal=Math.round(base+Math.sin(i/2.7)*260+(Math.random()-0.5)*180);
    S.data[ds].breakfast=[mkDemoFood('燕麦+鸡蛋+豆浆',Math.round(kcal*0.3))];
    S.data[ds].lunch=[mkDemoFood('鸡胸肉糙米饭套餐',Math.round(kcal*0.42))];
    S.data[ds].dinner=[mkDemoFood('三文鱼+蔬菜+紫薯',Math.round(kcal*0.28))];
    S.data[ds].snack=[];
  }
  saveData();
  render();
}
