function mkDemoFood(name,kcal){
  const c=Math.round(kcal*0.45/4),p=Math.round(kcal*0.28/4),f=Math.round(kcal*0.27/9);
  return {name:name,kcal:Math.round(kcal/10)*10,carbs:c,protein:p,fat:f,fiber:Math.round(c/28)};
}
function bosTrendData(){
  const end=new Date();end.setHours(0,0,0,0);
  let n;
  if(S.ovRange>0){n=S.ovRange;}
  else{
    let oldest=end.getTime();
    Object.keys(S.bodyLog).forEach(ds=>{const ts=new Date(ds+'T00:00:00').getTime();if(!isNaN(ts))oldest=Math.min(oldest,ts)});
    Object.keys(S.data).forEach(ds=>{const ts=new Date(ds+'T00:00:00').getTime();if(!isNaN(ts))oldest=Math.min(oldest,ts)});
    n=Math.max(7,Math.min(730,Math.round((end.getTime()-oldest)/86400000)+1));
  }
  n=Math.max(7,Math.min(730,n));
  const dates=[];
  for(let i=n-1;i>=0;i--){
    const d=new Date(end);d.setDate(d.getDate()-i);
    dates.push(dstr(d));
  }
  const read=(key,ds)=>{
    const bl=S.bodyLog[ds]||{};
    if(key==='sleep'){const x=parseFloat(bl.sleep_dur);return x>0?x:null;}
    if(key==='kcal'){const day=S.data[ds];if(day){const k=dayTotal(ds).kcal;return k>0?k:null;}return null;}
    if(key==='waist'){const x=parseFloat(bl.waist);return x>0?x:null;}
    const x=parseFloat(bl.hip);return x>0?x:null;
  };
  const series=TREND_KEYS.map(key=>{
    let vals=dates.map(ds=>read(key,ds));
    if(key==='waist'||key==='hip'){let last=lastGirth(dates[0],key).v>0?lastGirth(dates[0],key).v:null;vals=vals.map(v=>{if(v!=null)last=v;return last});}
    const aliveV=vals.filter(v=>v!=null);
    let lo=aliveV.length?Math.min.apply(null,aliveV):0;
    let hi=aliveV.length?Math.max.apply(null,aliveV):0;
    if(aliveV.length&&lo===hi){const d=Math.abs(lo)||1;lo-=d*.03;hi+=d*.03;}
    return {key:key,label:TREND_META[key].label,unit:TREND_META[key].unit,fmt:TREND_META[key].fmt,color:TREND_META[key].color,vals:vals,alive:aliveV.length,lo:lo,hi:hi};
  });
  return {dates:dates,series:series};
}
function bosDrawTrend(){
  if(S.tab!=='overview')return;
  const canvas=document.getElementById('trendCanvas');
  if(!canvas)return;
  const wrap=canvas.parentElement;
  const dpr=window.devicePixelRatio||1;
  const W=wrap.clientWidth||canvas.width||320;
  const H=window.innerWidth<=760?300:340;
  canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);
  canvas.style.width=W+'px';canvas.style.height=H+'px';
  const ctx=canvas.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,W,H);
  const t=bosTrendData(),n=t.dates.length;
  const vis=t.series.filter(s=>s.alive>0&&S.ovHide.indexOf(s.key)<0);
  const totalAlive=t.series.reduce((a,s)=>a+s.alive,0);
  const empty=document.getElementById('emptyChart');if(empty)empty.style.display=vis.length?'none':'flex';
  const meta=document.getElementById('chartMeta');
  if(meta)meta.textContent=vis.length?`${n} 天窗口 · ${totalAlive} 个记录点`:'';
  const tt=document.getElementById('chartTT');if(tt)tt.classList.remove('show');
  if(!vis.length)return;
  const P=TREND_PAD,iw=W-P.l-P.r,ih=H-P.t-P.b;
  if(iw<=0||ih<=0)return;
  const x=i=>P.l+(n===1?iw/2:iw*i/(n-1));
  const y=(s,v)=>{const lo=s.lo,hi=s.hi;return P.t+ih*(1-(v-lo)/(hi-lo));};
  const cs=getComputedStyle(document.documentElement);
  const mono=cs.getPropertyValue('--font-mono').trim()||'monospace';
  // 轻网格（无 Y 刻度——各线按自身区间归一化，纵向绝对位置不代表统一量纲）
  ctx.strokeStyle='rgba(60,58,50,0.08)';ctx.lineWidth=1;
  for(let g=1;g<=3;g++){
    const yy=P.t+ih*g/4;
    ctx.beginPath();ctx.moveTo(P.l,yy);ctx.lineTo(W-P.r,yy);ctx.stroke();
  }
  // 日期标签
  ctx.fillStyle='#8A867A';ctx.font='10px '+mono;ctx.textAlign='center';ctx.textBaseline='alphabetic';
  const xstep=Math.max(1,Math.ceil(n/6));
  for(let k=0;k<n;k+=xstep)ctx.fillText(t.dates[k].slice(5).replace('-','/'),x(k),H-8);
  // hover 竖线
  if(S.ovHover>=0&&S.ovHover<n){
    ctx.strokeStyle='rgba(194,98,59,0.55)';ctx.lineWidth=1;ctx.setLineDash([4,4]);
    ctx.beginPath();ctx.moveTo(x(S.ovHover),P.t);ctx.lineTo(x(S.ovHover),P.t+ih);ctx.stroke();ctx.setLineDash([]);
  }
  // 画线（每序列独立归一化）+ 末端圆点 + hover 点
  vis.forEach(s=>{
    ctx.strokeStyle=s.color;ctx.lineWidth=2;ctx.lineJoin='round';ctx.lineCap='round';
    ctx.beginPath();let pen=false,lastIdx=-1;
    for(let a=0;a<n;a++){
      const v=s.vals[a];
      if(v==null){pen=false;continue;}
      lastIdx=a;
      const xx=x(a),yy=y(s,v);
      if(!pen){ctx.moveTo(xx,yy);pen=true;}else ctx.lineTo(xx,yy);
    }
    ctx.stroke();
    if(lastIdx>=0){
      ctx.beginPath();ctx.arc(x(lastIdx),y(s,s.vals[lastIdx]),3.6,0,Math.PI*2);ctx.fillStyle=s.color;ctx.fill();
    }
    if(S.ovHover>=0&&S.ovHover<n){
      const hv=s.vals[S.ovHover];
      if(hv!=null){ctx.beginPath();ctx.arc(x(S.ovHover),y(s,hv),3,0,Math.PI*2);ctx.fillStyle=s.color;ctx.fill();}
    }
  });
  // tooltip：四行真实值
  if(S.ovHover>=0&&S.ovHover<n&&tt){
    const i=S.ovHover;
    const rows=vis.map(s=>`<span class="ttr"><i style="background:${s.color}"></i>${s.label} ${s.vals[i]!=null?s.fmt(s.vals[i]):'<span class="tt-n">无记录</span>'}</span>`).join('');
    tt.innerHTML='<b>'+esc(t.dates[i])+'</b>'+rows;
    tt.style.left=Math.min(Math.max(x(i),95),W-95)+'px';
    tt.classList.add('show');
  }
}
function bosHover(ev){
  const canvas=document.getElementById('trendCanvas');if(!canvas)return;
  const rect=canvas.getBoundingClientRect();
  const t=bosTrendData();if(!t.dates.length)return;
  const P=TREND_PAD;
  const iw=rect.width-P.l-P.r;
  if(iw<=0)return;
  let i=Math.round((ev.clientX-rect.left-P.l)/iw*(t.dates.length-1));
  i=Math.max(0,Math.min(t.dates.length-1,i));
  S.ovHover=i;bosDrawTrend();
}
/* ---------- 训练计划 · 7 天打卡（自然日 D1-D7，日期跟真实日历走） ---------- */
function bosPlanCard(){
  const _t0=new Date(S.today+'T00:00:00');
  if(!S.settings.planStart){S.settings.planStart=S.today;try{saveData()}catch(e){}}
  const plan=(S.settings.plan&&S.settings.plan.length===7)?S.settings.plan:DEF_PLAN;
  const base=new Date(S.settings.planStart+'T00:00:00');
  if(isNaN(base)){S.settings.planStart=S.today;return bosPlanCard()}
  if(base>_t0){ /* 起始日是未来日期=脏数据：打卡周里永远找不到「今天」，归位今天重算 */
    S.settings.planStart=S.today;try{saveData()}catch(e){};return bosPlanCard();
  }
  const today=_t0;
  let cycle=Math.floor((today-base)/86400000);
  if(cycle<0)cycle=0;
  const start=new Date(base.getTime()+cycle*7*86400000);
  const WD=['日','一','二','三','四','五','六'];
  const rows=[];let doneN=0;
  for(let i=0;i<7;i++){
    const dd=new Date(start.getTime()+i*86400000);
    const ds=dstr(dd);
    const isDone=!!S.weekLog[ds];
    if(isDone)doneN++;
    const isToday=ds===S.today;
    const lab='D'+(i+1)+'　'+(dd.getMonth()+1)+'.'+dd.getDate()+' 周'+WD[dd.getDay()];
    rows.push(`<div class="bos-plan-row ${isDone?'done':''} ${isToday?'today':''}" onclick="toggleWeek('${ds}')"><span class="dow">${lab}${isToday?'<span class="day-tag">今天</span>':''}</span><span class="pt">${esc(plan[i])}</span><span class="stamp"><svg viewBox="0 0 24 24"><path d="M4 12l5 5L20 7"/></svg></span></div>`);
  }
  const pct=Math.round(doneN/7*100);
  return `<div class="card"><div class="bos-card-hd"><span class="sec-title">训练计划 · 7 天打卡</span><span class="bos-sub">D${cycle*7+1} 起 · ${doneN}/7</span></div>
    <div class="bos-plan-list">${rows.join('')}</div>
    <div class="prog-label"><span>本周期完成</span><span>${doneN} / 7</span></div>
    <div class="prog-track"><div class="prog-fill" style="width:${pct}%"></div></div>
    <div class="bos-hint">计划内容与起始日（D1）在右上角齿轮里改 · 日期自动跟日历走 · 点行打卡</div></div>`;
}
function toggleWeek(ds){
  if(S.weekLog[ds])delete S.weekLog[ds];else S.weekLog[ds]=true;
  saveData();render();
}
/* ---------- 习惯打卡（齿轮可自定义） ---------- */
function bosHabitCard(){
  const habits=(S.settings.habits&&S.settings.habits.length)?S.settings.habits:DEF_HABITS;
  const today=todayStr();
  const hd=(S.habitLog[today]||[]).slice();
  const rows=habits.map((nm,i)=>{
    const isDone=hd.indexOf(i)>=0;
    return `<div class="bos-habit-row ${isDone?'done':''}" onclick="toggleHabit(${i})"><span class="stamp"><svg viewBox="0 0 24 24"><path d="M4 12l5 5L20 7"/></svg></span><span class="ht">${esc(nm)}</span></div>`;
  }).join('');
  let dots='',streak=0;
  for(let off=0;off<7;off++){
    const d=new Date();d.setDate(d.getDate()-off);
    const ds=dstr(d);
    const arr=S.habitLog[ds]||[];
    const all=habits.length>0&&arr.length>=habits.length;
    if(all&&off===streak)streak++;
    dots+=`<span class="hb-dot ${all?'on':''}" title="${ds}"></span>`;
  }
  return `<div class="card"><div class="bos-card-hd"><span class="sec-title">习惯打卡</span><span class="bos-sub">今日 ${hd.length}/${habits.length}</span></div>
    <div class="bos-habit-list">${rows}</div>
    <div class="bos-streak">${dots}<span class="cap">连续达标 ${streak} 天</span></div>
    <div class="bos-hint">习惯清单在右上角齿轮里自定义</div></div>`;
}
function toggleHabit(i){
  const today=todayStr();
  const arr=(S.habitLog[today]||[]).slice();
  const k=arr.indexOf(i);
  if(k>=0)arr.splice(k,1);else arr.push(i);
  S.habitLog[today]=arr;saveData();render();
}
/* ---------- 目标进度 & BMI（最后） ---------- */
function bosGoalCard(){
  const s=S.settings;
  const cur=parseFloat(S.body.weight)||null;
  const goal=s.goalWeight?parseFloat(s.goalWeight):null;
  const start=s.startWeight?parseFloat(s.startWeight):null;
  const hcm=parseFloat(S.body.height)||0;
  let pct=0,remainTxt='--',note='';
  if(cur!=null&&goal!=null){
    remainTxt=cur>goal?(cur-goal).toFixed(1)+' kg':'达成';
    if(cur<=goal)pct=1;
    else if(start!=null&&start>goal)pct=Math.max(0,Math.min(1,(start-cur)/(start-goal)));
  }
  note=(goal!=null&&start!=null)?`起始 ${fmtNum(start)} kg → 目标 ${fmtNum(goal)} kg`:(goal!=null?'目标 '+fmtNum(goal)+' kg（齿轮里填起始体重后显示进度）':'齿轮里设目标体重后显示进度');
  let bmiHtml='',marker=0;
  if(cur!=null&&hcm>0){
    const bmi=cur/((hcm/100)*(hcm/100));
    const cat=bmi<18.5?'偏瘦':bmi<24?'正常':bmi<28?'超重':'肥胖';
    const lo=(18.5*(hcm/100)*(hcm/100)).toFixed(1),hi=(23.9*(hcm/100)*(hcm/100)).toFixed(1);
    marker=Math.max(0,Math.min(1,(bmi-15)/(32-15)));
    bmiHtml=`BMI <b>${bmi.toFixed(1)}</b>（${cat}）· 身高 ${hcm} cm 的健康体重区间约 <b>${lo}–${hi} kg</b>`;
  }else if(cur!=null&&!hcm){bmiHtml='去「饮食 → 目标设置」填身高后显示 BMI';}
  return `<div class="card"><div class="bos-card-hd"><span class="sec-title">目标进度与 BMI</span></div>
    <div class="bos-metric-row">
      <div class="bos-metric"><div class="k">当前体重</div><div class="v">${fmtNum(cur)}<small> kg</small></div></div>
      <div class="bos-metric"><div class="k">目标体重</div><div class="v">${fmtNum(goal)}<small> kg</small></div></div>
      <div class="bos-metric"><div class="k">还差</div><div class="v">${remainTxt}</div></div>
    </div>
    <div class="prog-label"><span>减重进度</span><span>${Math.round(pct*100)}%</span></div>
    <div class="prog-track"><div class="prog-fill" style="width:${Math.round(pct*100)}%"></div></div>
    <div class="bos-goal-note">${esc(note)}</div>
    ${bmiHtml?`<div class="bos-bmi-line">${bmiHtml}</div><div class="bos-bmi-bar"><span class="t1"></span><span class="t2"></span><span class="t3"></span><span class="t4"></span></div><div class="bos-bmi-marker"><i style="left:${(marker*100).toFixed(1)}%"></i></div>`:''}
  </div>`;
}
/* ---------- 齿轮设置弹窗（今日目标 / 目标体重 / 习惯清单 / 周计划 / 调色保留） ---------- */
function openGear(){S.gearOpen=true;render()}
function closeGear(){S.gearOpen=false;render()}
function renderGear(){
  const s=S.settings,b=S.body;
  const nf=(id,label,val,ph,hint,t)=>`<div class="gear-f"><label for="${id}">${label}</label><input id="${id}" type="${t||'number'}" step="0.1" value="${val==null||val===''?'':esc(val)}" placeholder="${ph||''}">${hint?`<div class="gear-ft">${hint}</div>`:''}</div>`;
  return `<div class="gear-mask" onclick="if(event.target===this)closeGear()"><div class="gear-box" role="dialog" aria-modal="true" aria-label="设置">
    <div class="gear-hd"><h3>设置</h3><button class="gear-x" onclick="closeGear()" aria-label="关闭">✕</button></div>
    <div class="gear-bd">
      <div class="gear-sec">今日目标</div>
      <div class="gear-grid">
        <div class="gear-f" style="grid-column:1/-1"><label for="gName">称呼（问候用，可留空）</label><input id="gName" type="text" value="${esc(s.name||'')}"></div>
        <div class="gear-f" style="grid-column:1/-1"><label for="gToday">今日目标（自由填写 · 不限于体重）</label><input id="gToday" type="text" value="${esc(s.todayGoal||'')}" placeholder="如：睡够 8 小时 / 完成训练 / 62 kg"><div class="gear-ft">写在首页日期行，每天给自己立一个目标</div></div>
        ${nf('gGoal','目标体重 (kg)',s.goalWeight,'','只用于底部进度条，不显示在首页')}
        ${nf('gStart','起始体重 (kg)',s.startWeight,'','进度条起点，可留空')}
      </div>
      <div class="gear-sec">基础信息（全站共用）</div>
      <div class="gear-grid">
        <div class="gear-f" style="grid-column:1/-1"><label>性别</label>
          <div class="seg-ctrl"><button type="button" class="seg-opt ${b.gender==='female'?'active':''}" onclick="setGearSex('female',this)">女性</button><button type="button" class="seg-opt ${b.gender==='male'?'active':''}" onclick="setGearSex('male',this)">男性</button></div>
          <input type="hidden" id="gBioSex" value="${b.gender||'female'}">
        </div>
        ${nf('gBioH','身高',b.height,'如 165','cm')}
        ${nf('gBioW','体重',b.weight,'如 60','kg，用于 BMI / BMR')}
        ${nf('gBioY','出生年份',b.birthYear,'如 1979','当前 '+getAge()+' 岁')}
        <div class="gear-f"><label for="gBioAct">训练频率（活动量）</label><select id="gBioAct" class="act-sel" style="width:100%">${ACT.map(a=>`<option value="${a.v}" ${b.act==a.v?'selected':''}>${a.l}</option>`).join('')}</select><div class="gear-ft">驱动 BMR/TDEE 与饮食预设</div></div>
      </div>
      <div class="gear-sec">今日待办 · 批量粘贴（每行一条）</div>
      <textarea id="gTodo" rows="4" placeholder="19:30 练腿 45 分钟&#10;写周风险报告&#10;买菜">${esc((S.todoLog[S.today]||[]).map(x=>x.t).join('\n'))}</textarea>
      <div class="gear-ft">保存后替换今天的待办（前 2 条橙色 = 最重要的 20%）；留空则不改动</div>
      <div class="gear-sec">训练计划（每行一个 · 对应 D1-D7，7 天一个循环）</div>
      <div class="gear-f" style="margin-bottom:8px"><label>起始日（D1，默认今天）</label><input type="date" id="gPlanStart" value="${esc(s.planStart||'')}" onchange="void 0"></div>
      <textarea id="gPlan" rows="7">${esc((s.plan&&s.plan.length===7?s.plan:DEF_PLAN).join('\n'))}</textarea>
      <div class="gear-sec">我的训练模板（#名字 开头分段 · 下面每行一个动作）</div>
      <textarea id="gMyPlans" rows="7" placeholder="#腿日&#10;深蹲 5x5 80kg&#10;腿举 4x12&#10;#推日&#10;卧推 5x5 60kg&#10;肩上推举 3x8">${esc(s.myPlansText||'')}</textarea>
      <div class="gear-ft">保存后训练页出现「我的模板」按钮；周计划某天写了模板名（如「腿」），训练页当天会提示一键载入</div>
      <div class="gear-sec">习惯清单（每行一个）</div>
      <textarea id="gHabits" rows="5">${esc((s.habits&&s.habits.length?s.habits:DEF_HABITS).join('\n'))}</textarea>
      <div class="gear-sec">调色</div>
      <div class="gear-grid">
        <div class="gear-f"><label for="gTheme">主题色</label><input id="gTheme" type="color" value="${s.theme&&/^#[0-9a-fA-F]{6}$/.test(s.theme)?s.theme:'#2E4A3B'}"></div>
        <div class="gear-f"><label for="gBtn">按钮色</label><input id="gBtn" type="color" value="${s.button&&/^#[0-9a-fA-F]{6}$/.test(s.button)?s.button:'#C2623B'}"></div>
      </div>
      <div style="display:flex;justify-content:flex-end;margin-top:8px"><button class="gear-cancel" onclick="resetTheme()" title="清除自定义配色，一键恢复本版本默认（墨绿 + 陶土橙）">↺ 恢复版本默认配色</button></div>
    </div>
    <div class="gear-ft2"><button class="gear-cancel" onclick="closeGear()">取消</button><button class="gear-save" onclick="saveGear()">保存设置</button></div>
  </div></div>`;
}
function setGearSex(v,btn){document.getElementById('gBioSex').value=v;[...btn.parentNode.children].forEach(x=>x.classList.remove('active'));btn.classList.add('active')}
function resetTheme(){
  delete S.settings.theme;delete S.settings.button;
  const root=document.documentElement.style;
  root.removeProperty('--primary');root.removeProperty('--accent');root.removeProperty('--accent-deep');
  saveData();render();
  const el=document.getElementById('saved-msg');
  if(el){el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2000)}
}
function saveGear(){
  const gid=id=>document.getElementById(id);
  const s=S.settings;
  s.name=gid('gName').value.trim().slice(0,20);S.body.careName=s.name;
  s.todayGoal=gid('gToday').value.trim().slice(0,40);
  const num=(id,min,max)=>{const x=parseFloat(gid(id).value);return isNaN(x)||x<min||x>max?'':x;};
  s.goalWeight=num('gGoal',20,300);
  s.startWeight=num('gStart',20,400);
  const hb=gid('gHabits').value.split('\n').map(x=>x.trim()).filter(Boolean);
  const pl=gid('gPlan').value.split('\n').map(x=>x.trim()).filter(Boolean);
  const pst=gid('gPlanStart').value;
  if(pst)s.planStart=pst;
  s.habits=hb.length?hb:DEF_HABITS.slice();
  s.plan=pl.length===7?pl:DEF_PLAN.slice();
  s.myPlansText=gid('gMyPlans').value;
  s.myPlans=parseMyPlans(s.myPlansText);
  const tdTxt=gid('gTodo').value;
  if(tdTxt.trim())S.todoLog[S.today]=tdTxt.split('\n').map(x=>x.trim().slice(0,40)).filter(Boolean).map(t=>({t,done:false}));
  s.theme=gid('gTheme').value||'#2E4A3B';
  s.button=gid('gBtn').value||'#C2623B';
  // 基础信息 → S.body（与饮食页「身体数据」同源 nutrilog_body）
  const b=S.body;
  b.gender=gid('gBioSex').value==='male'?'male':'female';
  const fnum=(id,cur,min,max)=>{const x=parseFloat(gid(id).value);return isNaN(x)||x<min||x>max?cur:x;};
  b.height=fnum('gBioH',b.height,80,250);
  b.weight=fnum('gBioW',b.weight,20,400);
  b.birthYear=fnum('gBioY',b.birthYear,1920,2026);
  b.act=parseFloat(gid('gBioAct').value)||b.act;
  S.presets=calcPresets(calcBMR(b.gender,b.weight,b.height,getAge()),b.act);
  S.selectedPreset=null;
  saveData();bosApplyTheme();S.gearOpen=false;render();
}
// ── 启动：应用已存主题 + 窗口尺寸变化重绘趋势图 ──
bosApplyTheme();

window.addEventListener('resize',function(){if(S.tab==='overview')bosDrawTrend();});
